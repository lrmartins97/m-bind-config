[include impressao/klipper_base.cfg]
[include impressao/inicio_fim.cfg]
[include impressao/pausa_cancelar.cfg]
[include impressao/troca_ferramenta.cfg]
[include impressao/limpeza.cfg]
[include impressao/materiais.cfg]
[include impressao/seringas.cfg]

# --- Calibracao -------------------------------------------------------------
[include calibracao/comandos.cfg]
[include calibracao/altura_e_prato.cfg]
[include calibracao/z_t1.cfg]
[include calibracao/xy_manual.cfg]
[include calibracao/xy_camara.cfg]
[include calibracao/camara.cfg]
[include calibracao/ktamv_originais.cfg]

# --- Desenvolvimento --------------------------------------------------------
[include desenvolvimento/burn_in.cfg]
# Celula de carga do prato: desligada. Para ligar, tirar o "#" da linha abaixo.
#[include desenvolvimento/celula_carga.cfg]

# --- Instalados por outros programas (ficam nesta pasta) --------------------
# O usb_import.cfg e' incluido no printer.cfg, porque e' la' que o instalador
# dele o procura. O mainsail.cfg (do Mainsail) nao e' usado: a pausa e o
# cancelar estao em impressao/pausa_cancelar.cfg.
[include timelapse.cfg]
