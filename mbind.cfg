# ============================================================================
# M-BIND - lista dos ficheiros da configuracao
# ============================================================================
# Este ficheiro e' igual em todas as maquinas (vem do repositorio m-bind-config).
# O que e' de cada maquina (numeros de serie das placas, PID, altura do Z) esta
# no printer.cfg, que inclui este ficheiro.
#
# Onde esta cada coisa:
#   hardware/          o que esta ligado e onde: placas, eixos, cabecas, luzes
#   impressao/         o que a maquina faz ao imprimir: inicio e fim, pausa,
#                      troca de ferramenta, limpeza, materiais, seringas
#   calibracao/        altura e nivelamento do prato, T1 em relacao ao T0
#                      (Z e X/Y) e camara
#   desenvolvimento/   testes e funcoes que ainda nao estao em uso
#   (esta pasta)       ficheiros que outros programas procuram aqui ou escrevem
#                      sozinhos. Nao os mudar de sitio: moonraker.conf,
#                      crowsnest.conf, sonar.conf, KlipperScreen.conf,
#                      mainsail.cfg, timelapse.cfg, usb_import.cfg,
#                      variables.cfg, ktamv_camera_matrix.json
# ============================================================================

