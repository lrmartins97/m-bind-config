# ============================================================================
# hardware/h36_combo.cfg
# FYSETC H36 Combo V2.0 (STM32G431) - nomes dos pinos das placas das cabecas
# ============================================================================
# Este ficheiro NAO liga nada. So da nomes aos pinos. As duas cabecas usam a
# mesma placa, por isso os nomes servem para as duas:
#     tool_0:HE0    aquecimento da cabeca esquerda (T0)
#     tool_1:HE0    aquecimento da cabeca direita  (T1)
# O que esta ligado em cada cabeca diz-se em cabeca_t0.cfg e cabeca_t1.cfg.
#
# Fontes (repositorio FYSETC/H36_Combo_V2), conferidas a 2026-10-07:
#   - hardware/H36_V2.0 PINOUT.pdf          fichas exteriores
#   - hardware/Schematic_H36 v2.0.pdf       esquema (pinos internos)
#   - firmware/Klipper/H36_combo_template.cfg
#
# Dois pontos em que o template da FYSETC esta desatualizado; aqui segue-se
# o PINOUT e o esquema da V2.0, que dizem o mesmo:
#   - o bloco de comentarios "I/O" do template (IO.0: PA15, IO.1: PC7, ...)
#     e' da versao anterior da placa;
#   - o template sugere "diag_pin: PC15", mas PC15 e' o DIR do motor. No
#     esquema o DIAG do driver esta em PA13.
#
# Regra do Klipper: o mesmo pino nao pode ser usado com dois nomes na mesma
# placa. Usa sempre o nome daqui.
# ============================================================================

[board_pins h36_combo]
mcu: tool_0, tool_1

# --- Motor do extrusor (driver TMC2209 na placa, ficha MOTOR) ----------------
# MOTOR_DIAG vem do esquema e nunca foi usado nesta maquina. O pino (PA13) e'
# partilhado com a ficha de programacao (SWDIO).
# (o Klipper obriga a que um dos grupos se chame so' "aliases"; e' este)
aliases:
    MOTOR_STEP=PB9, MOTOR_DIR=PC15, MOTOR_EN=PC14,
    MOTOR_UART=PB6, MOTOR_DIAG=PA13,

# --- Aquecimento -------------------------------------------------------------
#   HE0          saida do aquecedor (24V, 5A max)
#   TE0          termistor (pullup de 2.2k na placa: "pullup_resistor: 2200")
#   DRIVER_TEMP  termistor do driver do motor, montado na placa
aliases_aquecimento:
    HE0=PB13, TE0=PA3, DRIVER_TEMP=PA0,

# --- Ventoinhas: fichas FAN0 a FAN3 (0.5A max cada) --------------------------
# As de 3 pinos tem tacometro. A FAN2 tem 2 pinos, sem tacometro.
aliases_ventoinhas:
    FAN0=PB12, FAN0_TACH=PB14,
    FAN1=PB2,  FAN1_TACH=PB1,
    FAN2=PB0,
    FAN3=PB15, FAN3_TACH=PA8,

# --- Entradas/saidas: fichas IO.0 a IO.4 -------------------------------------
# Entrada de 3.3V a 24V (fins de curso) ou saida de 5V/24V (LEDs RGB).
#   IO.0 e IO.1 partilham uma ficha de 4 pinos.
aliases_io:
    IO0=PB3, IO1=PB4, IO2=PB5,
    IO3_RGB0=PA10, IO4_RGB1=PA9,

# --- Acelerometro ADXL345 montado na placa (SPI por software) ----------------
aliases_adxl:
    ADXL_CS=PA4, ADXL_SCK=PA5, ADXL_MISO=PA6, ADXL_MOSI=PA7,

# Pinos que NAO devem ser usados na config:
#   PA2          escolhe USB ou CAN; e' definido ao compilar o firmware
#   PA11, PA12   USB
# Pinos livres na regua de pinos (sem nome aqui): PA1, PA14, PA15, PB7,
# PB10, PB11. Ver o PINOUT.
