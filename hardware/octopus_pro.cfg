# ============================================================================
# hardware/octopus_pro.cfg
# BigTreeTech Octopus Pro V1.1 (STM32H723) - nomes dos pinos da placa principal
# ============================================================================
# Diz ao Klipper onde esta a placa (USB) e da nomes aos pinos, iguais aos que
# estao escritos na placa. Este ficheiro nao liga nada: o que esta ligado a
# cada ficha diz-se em eixos.cfg e em luzes_ventoinhas.cfg, por exemplo:
#     step_pin: MOTOR0_STEP
#
# Fontes, conferidas a 2026-10-07:
#   - Klipper:      config/generic-bigtreetech-octopus-pro-v1.1.cfg
#   - BigTreeTech:  "BIGTREETECH Octopus Pro V1.1-Pin" (2023-11-02)
#
# ATENCAO: e' para a Octopus Pro V1.1. A V1.0 e a Octopus sem "Pro" tem
# pinos diferentes; nao usar este ficheiro com essas placas.
#
# Regra do Klipper: o mesmo pino nao pode ser usado com dois nomes. Se uma
# seccao usar FAN2 e outra usar PD12 (o mesmo pino), o Klipper recusa a
# config ("pin ... is an alias for ..."). Usa sempre o nome daqui.
# ============================================================================

# --- Ligacao a placa (USB) ---------------------------------------------------
# O numero de serie e' o desta placa. Para ver o de outra:
#     ls /dev/serial/by-id/
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32h723xx_360028001051313234353230-if00

[board_pins]

# --- Motores: fichas MOTOR0 a MOTOR7 -----------------------------------------
# STEP / DIR / EN (enable) e UART do driver (em drivers SPI e' o pino CS).
# (o Klipper obriga a que um dos grupos se chame so' "aliases"; e' este)
aliases:
    MOTOR0_STEP=PF13, MOTOR0_DIR=PF12, MOTOR0_EN=PF14, MOTOR0_UART=PC4,
    MOTOR1_STEP=PG0,  MOTOR1_DIR=PG1,  MOTOR1_EN=PF15, MOTOR1_UART=PD11,
    MOTOR2_STEP=PF11, MOTOR2_DIR=PG3,  MOTOR2_EN=PG5,  MOTOR2_UART=PC6,
    MOTOR3_STEP=PG4,  MOTOR3_DIR=PC1,  MOTOR3_EN=PA2,  MOTOR3_UART=PC7,
    MOTOR4_STEP=PF9,  MOTOR4_DIR=PF10, MOTOR4_EN=PG2,  MOTOR4_UART=PF2,
    MOTOR5_STEP=PC13, MOTOR5_DIR=PF0,  MOTOR5_EN=PF1,  MOTOR5_UART=PE4,
    MOTOR6_STEP=PE2,  MOTOR6_DIR=PE3,  MOTOR6_EN=PD4,  MOTOR6_UART=PE1,
    MOTOR7_STEP=PE6,  MOTOR7_DIR=PA14, MOTOR7_EN=PE0,  MOTOR7_UART=PD3,

# --- Fins de curso: fichas STOP0 a STOP7 -------------------------------------
# O DIAG do driver n (homing sem sensor) vai dar ao mesmo pino do STOPn,
# quando o jumper DIAG desse driver esta posto.
aliases_stops:
    STOP0=PG6,  STOP1=PG9,  STOP2=PG10, STOP3=PG11,
    STOP4=PG12, STOP5=PG13, STOP6=PG14, STOP7=PG15,

# --- Ventoinhas: fichas FAN0 a FAN5 (FAN6 e FAN7 estao sempre ligadas) -------
aliases_ventoinhas:
    FAN0=PA8,  FAN1=PE5,  FAN2=PD12,
    FAN3=PD13, FAN4=PD14, FAN5=PD15,

# --- Aquecimento: saidas HE0 a HE3 e cama; termistores TB, T0 a T3 -----------
# (os termistores chamam-se TEMP... para nao se confundirem com os comandos
#  T0 / T1 de troca de ferramenta)
aliases_aquecimento:
    HE0=PA0, HE1=PA3, HE2=PB0, HE3=PB11, BED_OUT=PA1,
    TEMP_BED=PF3, TEMP0=PF4, TEMP1=PF5, TEMP2=PF6, TEMP3=PF7,

# --- Outras fichas -----------------------------------------------------------
#   RGB                 ficha de LEDs enderecaveis (neopixel)
#   PROBE_SERVO/_SENSOR ficha "Probe" (BLTouch: controlo / sensor)
#   IND_PROBE           ficha da sonda indutiva (entrada isolada)
#   PWR_DET, PS_ON      detecao de falha de energia / controlo da fonte
#   TFT_TX, TFT_RX      ficha TFT (UART1): 5V GND PA9 PA10 RST
#   I2C_SCL, I2C_SDA    ficha I2C
aliases_outros:
    RGB=PB10,
    PROBE_SERVO=PB6, PROBE_SENSOR=PB7, IND_PROBE=PC5,
    PWR_DET=PC0, PS_ON=PE11,
    TFT_TX=PA9, TFT_RX=PA10,
    I2C_SCL=PB8, I2C_SDA=PB9,

# Fichas EXP1/EXP2 (ecra), SPI, MAX31865 e CAN: nao estao aqui porque esta
# maquina nao as usa. Estao no ficheiro do Klipper indicado no topo.
