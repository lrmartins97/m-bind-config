# ============================================================================
# hardware/luzes_ventoinhas.cfg
# Ventoinhas da camara, LEDs UV e iluminacao (camara de calibracao e
# interior da maquina).
# Os pinos tem os nomes das fichas da placa (hardware/octopus_pro.cfg).
# ============================================================================

[multi_pin my_fans]
pins: FAN2, FAN3

[fan_generic Chamber_Fan]
pin: multi_pin:my_fans

[multi_pin UV_Led]
pins: FAN0, FAN1

[output_pin UV]
pin: multi_pin: UV_Led
pwm: true
value: 0
shutdown_value: 0
cycle_time: 0.01

# Exemplo de como configurarás as fans das cabeças no futuro:
#[fan_generic fan_t0]
#pin: PD12

# [fan_generic fan_t1]
# pin: PB1

[neopixel Led_Nozzle_Cam]
pin: RGB
chain_count:12
color_order: GRB
initial_RED: 0
initial_GREEN: 0
initial_BLUE: 0
#initial_WHITE: 0.0

#[neopixel Led_Portico]
#pin:PB10
#chain_count:20
#color_order: GRBW
#initial_RED: 0.12
#initial_GREEN: 0.92
#initial_BLUE: 1.0
#initial_WHITE: 0.0

[neopixel Led_Chamber]
pin: STOP4
chain_count:20
color_order: GRBW
initial_RED: 1.0
initial_GREEN: 1.0
initial_BLUE: 1.0
initial_WHITE: 0.0

[gcode_macro TURN_OFF_LIGHTS]
gcode:
    SET_LED LED=Led_Portico GREEN=0 RED=0 BLUE=0
    SET_LED LED=Led_Chamber GREEN=0 RED=0 BLUE=0
