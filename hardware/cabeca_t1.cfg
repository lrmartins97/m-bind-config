# ============================================================================
# hardware/cabeca_t1.cfg
# Cabeca direita (T1): placa FYSETC H36 Combo, extrusor (embolo da seringa),
# aquecimento e driver do motor.
# Os pinos tem os nomes das fichas da placa (hardware/h36_combo.cfg).
# ============================================================================

[mcu tool_1]
serial: /dev/serial/by-id/usb-Klipper_stm32g431xx_2A005D000D50465236353520-if00

#####################################################################
# Extruder
#####################################################################

[extruder1]
step_pin: tool_1:MOTOR_STEP
dir_pin: tool_1:MOTOR_DIR
enable_pin: !tool_1:MOTOR_EN
rotation_distance: 2   
microsteps: 16
full_steps_per_rotation: 200    #200 for 1.8 degree, 400 for 0.9 degree
nozzle_diameter: 0.400
filament_diameter: 15
heater_pin: tool_1:HE0
pullup_resistor: 2200
sensor_type: Generic 3950
sensor_pin: tool_1:TE0
min_temp: 0 
max_temp: 90
max_power: 1.0
min_extrude_temp: 15
# PID (control, pid_kp, pid_ki, pid_kd): esta no printer.cfg, para o
# PID_CALIBRATE seguido de SAVE_CONFIG o conseguir gravar.
max_extrude_cross_section: 5000.0

[tmc2209 extruder1]
uart_pin: tool_1:MOTOR_UART
interpolate: false
run_current: 0.85
sense_resistor: 0.110
stealthchop_threshold: 0
#diag_pin: tool_0:PC15

[adxl345]
cs_pin: tool_1:ADXL_CS
spi_software_sclk_pin: tool_1:ADXL_SCK
spi_software_mosi_pin: tool_1:ADXL_MOSI
spi_software_miso_pin: tool_1:ADXL_MISO
axes_map: -y,z,-x

[resonance_tester]
accel_chip: adxl345
probe_points:
    300,300,30 # an example

