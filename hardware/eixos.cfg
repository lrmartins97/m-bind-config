# ============================================================================
# hardware/eixos.cfg
# Movimento: cinematica, home e os quatro eixos (X = T0, X2 = T1, Y, Z),
# com os drivers dos motores.
# Os pinos tem os nomes das fichas da placa (hardware/octopus_pro.cfg).
#
# A altura do Z (position_endstop do [stepper_z]) NAO esta aqui: e' gravada
# pelo CALIBRAR_Z + SAVE_CONFIG no fim do printer.cfg.
# ============================================================================

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 1000
max_z_velocity: 5
max_z_accel: 100


[safe_z_home]
home_xy_position:83, 113
speed: 50.0
z_hop:12
z_hop_speed: 15.0
move_to_previous: True



[stepper_x]
step_pin: MOTOR0_STEP
dir_pin: !MOTOR0_DIR
enable_pin: !MOTOR0_EN
microsteps: 16
rotation_distance: 40
endstop_pin: ^STOP0
homing_retract_dist: 5.0
position_endstop: -76.5
position_min: -78
position_max: 110
homing_speed: 50

[stepper_y]
step_pin: MOTOR6_STEP
dir_pin: !MOTOR6_DIR
enable_pin: !MOTOR6_EN
microsteps: 16
rotation_distance: 40
gear_ratio: 40:20
endstop_pin: ^!STOP2
homing_retract_dist: 5.0
position_endstop: 118
position_min: -4
position_max: 118.5
homing_speed: 50

[dual_carriage]
axis: x
safe_distance: 5
step_pin: MOTOR7_STEP
dir_pin: !MOTOR7_DIR
enable_pin: !MOTOR7_EN
microsteps:16
rotation_distance:40
endstop_pin: ^STOP1
homing_retract_dist: 8.0
position_endstop:178
position_min:-20
position_max:180
homing_speed: 50

[stepper_z]
step_pin: MOTOR1_STEP
dir_pin: !MOTOR1_DIR
enable_pin: !MOTOR1_EN
microsteps: 16
rotation_distance: 8
endstop_pin: ^!STOP3
#position_endstop: 0
position_min: -10
position_max: 30
homing_positive_dir: false


########################################
# TMC2209 configuration
########################################

[tmc2209 stepper_x]
uart_pin: MOTOR0_UART
run_current: 0.9
#stealthchop_threshold:999999
#diag_pin: PG6

[tmc2209 stepper_y]
uart_pin: MOTOR6_UART
#run_current: 0.800
run_current: 1
#diag_pin: PG10

[tmc2209 dual_carriage]
uart_pin: MOTOR7_UART
run_current: 0.9
#stealthchop_threshold:999999
#diag_pin: PG9

[tmc2209 stepper_z]
uart_pin: MOTOR1_UART
run_current: 0.600
#diag_pin: PG11
