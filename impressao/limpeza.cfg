# ============================================================================
# impressao/limpeza.cfg
# Limpeza dos bicos (seringas / pasta): estacoes de cada ferramenta e valores
# de purga, retracao e reposicao.
# ============================================================================
#
# Cada ferramenta tem as suas estacoes, fixas a estrutura, junto ao seu parque:
#   purga -> espera (a pasta assenta) -> escova -> wiper (parede de silicone)
#
#   CLEAN_NOZZLE TOOL=0|1 [PURGE=0|1] [RETURN=0|1] [UNRETRACT=0|1]
#       Limpa uma ferramenta. Ativa-a se for preciso (T0/T1). PURGE=0 salta a
#       purga (so escova e wiper). RETURN=1 volta ao ponto de partida.
#       Depois da purga o embolo recua (retracao) e a ponta fica sem pressao.
#       A reposicao (unretract) e' feita em cima do balde, no fim da limpeza,
#       quando a seguir se vai imprimir: no PRINT_START e nas trocas de
#       ferramenta. Ao retomar uma pausa e' feita ja na peca (a posicao e'
#       conhecida). Uma limpeza a mao (sem parametros) nao repoe: fica
#       registado e a purga seguinte compensa. UNRETRACT=1 pede a reposicao.
#
#   Materiais (materiais.cfg, opcional): os valores de purga/retracao/
#       reposicao do material escolhido (SET_MATERIAL) substituem os desta
#       ferramenta. Sem material (0) usam-se os valores daqui.
#
# Usado automaticamente:
#   - no PRINT_START, para cada ferramenta usada;
#   - nas trocas de ferramenta durante a impressao (clean_on_toolchange);
#   - nas calibracoes CALIBRATE_IDEX*: cada ferramenta e' limpa imediatamente
#     antes de ser medida (clean_before_calibration, clean_each_measurement).
#
# POSICOES: as estacoes estao fixas a estrutura, por isso as coordenadas X/Y
# sao posicoes FISICAS da cabeca, iguais para qualquer calibracao. A macro
# compensa sozinha os offsets de ferramenta ativos. A altura do bico em relacao
# as estacoes e' mecanica (a cabeca nao se move em Z); o Z so serve para
# afastar o prato durante a deslocacao. As estacoes tem de ficar FORA da
# area do prato.
#
# Cada zona fica desligada (enable: 0) ate as suas posicoes estarem medidas.
# ============================================================================
[gcode_macro _CLEAN_VARS]
# --- Geral ---
variable_safe_z: 15                 ; Z minimo durante as deslocacoes (prato afastado). Tem de livrar o que estiver no prato (placa, caixa de Petri)
variable_hop: 3                     ; Afastamento extra do prato antes de sair da posicao atual (mm)
variable_z_speed: 10                ; Velocidade do Z (mm/s)
variable_travel_speed: 100          ; Velocidade de deslocacao ate as estacoes (mm/s)
variable_clean_on_toolchange: 1     ; 1 = limpar a ferramenta que entra em cada troca durante a impressao
variable_clean_before_calibration: 1 ; 1 = limpar os dois bicos no inicio das calibracoes CALIBRATE_IDEX_*
variable_purge_before_calibration: 1 ; 1 = incluir a purga antes das calibracoes (0: so escova e wiper)
variable_clean_on_resume: 1         ; 1 = purgar e limpar a ferramenta ao retomar depois de uma pausa (RESUME)
variable_resume_clean_min_pause: 30 ; so' limpa ao retomar se a pausa durou pelo menos isto (s)
variable_clean_each_measurement: 1  ; calibracoes: 1 = limpar cada ferramenta antes de CADA medicao (a 1a com purga, as seguintes so escova e wiper); 0 = so antes da 1a
variable_calib_cleaned_t0: 0        ; interno: o T0 ja foi limpo nesta calibracao
variable_calib_cleaned_t1: 0        ; interno: idem para o T1
variable_calib_clean: 1             ; interno: LIMPEZA pedida na calibracao em curso (1 = limpar, 0 = sem limpeza)
variable_skip_toolchange_clean: 0   ; interno: evita limpar duas vezes quando e' o proprio CLEAN_NOZZLE a trocar de ferramenta
variable_calibration_active: 0      ; interno: 1 durante a calibracao automatica do PRINT_START (as trocas da calibracao nao limpam)
variable_t0_retracted: 0            ; interno: 1 = o T0 ficou com a retracao da purga por repor (depois de uma limpeza para calibracao)
variable_t1_retracted: 0            ; interno: idem para o T1
variable_t0_warned: 0               ; interno: aviso "sem estacoes" ja mostrado nesta sessao (T0)
variable_t1_warned: 0               ; interno: idem para o T1
variable_eff_t0: {}                 ; interno: valores em uso do T0 (os do limpeza.cfg, com os do material por cima)
variable_eff_t1: {}                 ; interno: idem para o T1
variable_mat_warned: 0              ; interno: aviso de material inexistente ja mostrado nesta sessao

# --- T0: purga ---
variable_t0_purge_enable: 1         ; 0 ate a posicao estar medida
variable_t0_purge_x: -75.0          ; MEDIR
variable_t0_purge_y: 67.0           ; MEDIR
variable_t0_purge_amount: 1.0       ; Avanco do embolo na purga (mm do eixo do extrusor)
variable_t0_purge_speed: 0.2        ; Velocidade do embolo na purga (mm/s)
variable_t0_purge_dwell: 16         ; Espera apos a purga e a retracao, para a pasta assentar (s)
variable_t0_purge_retract: 0.9      ; Retracao do embolo depois da purga, para aliviar a pressao e nao pingar (mm; 0 = sem retracao)
variable_t0_purge_retract_speed: 0.5 ; Velocidade da retracao (mm/s)
variable_t0_unretract: 0.9          ; Reposicao (unretract): quanto o embolo avanca antes de voltar a imprimir (mm; pode ser menor ou maior do que a retracao)
variable_t0_unretract_speed: 0.5    ; Velocidade da reposicao (mm/s)
variable_t0_unretract_dwell: 5      ; Espera depois da reposicao, antes de seguir (s; 0 = sem espera)
variable_t0_resume_purge_amount: 1.0 ; Purga ao retomar depois de uma pausa (mm)
# --- T0: escova ---
variable_t0_brush_enable: 1
variable_t0_brush_x0: -65.0
variable_t0_brush_y0: 67.0
variable_t0_brush_x1: -60.0
variable_t0_brush_y1: 39.0
variable_t0_brush_passes: 2         ; ziguezague: varrimentos completos (1 = y0 -> y1; 2 = ida e volta, acaba perto de y0) | linha: passagens (ida = 1, volta = 1)
variable_t0_brush_speed: 150        ; mm/s
variable_t0_brush_mode: 1           ; 1 = ziguezague (vai-vem em X entre x0 e x1, a avancar de y0 para y1) | 0 = linha entre os dois pontos
variable_t0_brush_step: 2.0         ; ziguezague: avanco em Y a cada ida ou volta (mm)
# --- T0: wiper (parede de silicone) ---
variable_t0_wiper_enable: 1
variable_t0_wiper_x0: -59.5     ; 6 mm a esquerda da parede (lado do parque)
variable_t0_wiper_y0: 80.0      ; ao fundo do prato: a cabeca volta a peca vinda de tras
variable_t0_wiper_x1: -47.5     ; 6 mm a direita da parede (lado do prato)
variable_t0_wiper_y1: 80.0
variable_t0_wiper_passes: 5
variable_t0_wiper_speed: 30

# --- T1: purga ---
variable_t1_purge_enable: 1
variable_t1_purge_x: 178.0          ; balde do T1
variable_t1_purge_y: 67.0           ; = entrada da escova (caminho mais curto)
variable_t1_purge_amount: 1.0
variable_t1_purge_speed: 0.2
variable_t1_purge_dwell: 16
variable_t1_purge_retract: 0.9
variable_t1_purge_retract_speed: 0.5
variable_t1_unretract: 0.9
variable_t1_unretract_speed: 0.5
variable_t1_unretract_dwell: 5
variable_t1_resume_purge_amount: 1.0
# --- T1: escova ---
variable_t1_brush_enable: 1
variable_t1_brush_x0: 169.0         ; entrada (fundo, lado do parque do T1)
variable_t1_brush_y0: 67.0
variable_t1_brush_x1: 164.0         ; saida (frente, lado do prato)
variable_t1_brush_y1: 39.0
variable_t1_brush_passes: 2
variable_t1_brush_speed: 50
variable_t1_brush_mode: 1
variable_t1_brush_step: 2.0
# --- T1: wiper (parede de silicone) ---
variable_t1_wiper_enable: 1
variable_t1_wiper_x0: 162.0     ; 6 mm a direita da parede (lado do parque do T1); parede em X 156
variable_t1_wiper_y0: 80.0      ; ao fundo do prato
variable_t1_wiper_x1: 150.0     ; 6 mm a esquerda da parede (lado do prato)
variable_t1_wiper_y1: 80.0
variable_t1_wiper_passes: 5
variable_t1_wiper_speed: 30

# --- Load / unload do empurrador do embolo (preparado, ainda nao exposto) ---
variable_t0_load_distance: -20.0    ; Movimento do empurrador para libertar a seringa (mm; sinal = sentido)
variable_t0_unload_distance: 20.0   ; Movimento para voltar a encostar ao embolo (mm)
variable_t1_load_distance: -20.0
variable_t1_unload_distance: 20.0
variable_load_speed: 2              ; mm/s
gcode:

# ---------------------------------------------------------------------------
# Comando para o utilizador
# ---------------------------------------------------------------------------
[gcode_macro CLEAN_NOZZLE]
description: Limpa o bico de uma ferramenta (purga, escova, wiper). TOOL=0 ou TOOL=1
gcode:
    {% set tool = params.TOOL|default(-1)|int %}
    {% if tool != 0 and tool != 1 %}
        {action_raise_error("CLEAN_NOZZLE: indica TOOL=0 ou TOOL=1.")}
    {% endif %}
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set p = "t" ~ tool ~ "_" %}
    {% set purge = params.PURGE|default(1)|int == 1 and cv[p ~ "purge_enable"]|int == 1 %}
    {% set any_zone = purge or cv[p ~ "brush_enable"]|int == 1 or cv[p ~ "wiper_enable"]|int == 1 %}
    {% if not any_zone %}
        RESPOND PREFIX="info" MSG="Limpeza do T{tool}: nenhuma zona ativa em _CLEAN_VARS. Nada foi feito."
    {% else %}
        HOME_IF_NEEDED
        # Ativa a ferramenta ANTES de guardar qualquer estado (os offsets
        # guardados e repostos pertencem sempre a ferramenta que esta a limpar).
        # Durante uma impressao, o T0/T1 tambem limparia a ferramenta que entra;
        # aqui isso duplicava a limpeza, por isso fica suspenso nesta troca.
        {% if tool == 1 and printer.dual_carriage["carriage_1"] != "PRIMARY" %}
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=1
            T1
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=0
        {% elif tool == 0 and printer.dual_carriage["carriage_0"] != "PRIMARY" %}
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=1
            T0
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=0
        {% endif %}
        _MATERIAL_APPLY TOOL={tool}
        _CLEAN_RUN TOOL={tool} PURGE={1 if purge else 0} RETURN={params.RETURN|default(1)|int} UNRETRACT={params.UNRETRACT|default(0)|int} RESUME={params.RESUME|default(0)|int} LIFT={params.LIFT|default(1)|int}
    {% endif %}

# ---------------------------------------------------------------------------
# Uso interno
# ---------------------------------------------------------------------------

# Sequencia de limpeza com a ferramenta ja ativa
[gcode_macro _CLEAN_RUN]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% set p = "t" ~ tool ~ "_" %}
    {% set org = printer.gcode_move.homing_origin %}
    {% set raw = printer.toolhead.position %}
    {% set start = printer.gcode_move.gcode_position %}
    # Z de deslocacao em coordenadas fisicas: acima da posicao atual + hop,
    # nunca abaixo de safe_z, nunca acima do limite do eixo.
    {% set zmax = printer.toolhead.axis_maximum.z %}
    {% set travel_z_raw = [[raw.z + cv.hop, cv.safe_z]|max, zmax]|min %}
    {% set travel_z = travel_z_raw - org.z %}
    {% set fz = cv.z_speed * 60 %}
    {% set ft = cv.travel_speed * 60 %}

    SAVE_GCODE_STATE NAME=_clean_nozzle
    G90
    # LIFT=0 (so' nas trocas de ferramenta): a cabeca sai do parque e volta
    # a ele sem passar por cima do prato, por isso o prato fica onde esta (o
    # estacionamento da cabeca que saiu ja o afastou)
    {% if params.LIFT|default(1)|int == 1 %}
        G1 Z{travel_z} F{fz}
    {% endif %}

    # Valores em uso: os desta ferramenta, com os do material por cima
    # (calculados por _MATERIAL_APPLY imediatamente antes)
    {% set ev = cv["eff_t" ~ tool] %}
    # Purga -> retracao -> espera. Se ficou uma retracao por repor (limpeza
    # anterior sem reposicao), a purga empurra tambem esse bocado (o valor
    # de reposicao). Ao retomar uma pausa usa-se a purga de retomar.
    {% set retr = ev.retract|float %}
    {% set pending = cv[p ~ "retracted"]|default(0)|int == 1 %}
    {% set purged = params.PURGE|int == 1 %}
    {% set amount = ev.resume_purge_amount if params.RESUME|default(0)|int == 1 else ev.purge_amount %}
    {% if purged %}
        G1 X{cv[p ~ "purge_x"] - org.x} Y{cv[p ~ "purge_y"] - org.y} F{ft}
        M400
        M83
        G1 E{amount + (ev.unretract if pending else 0)} F{ev.purge_speed * 60}
        {% if retr > 0 %}
            G1 E-{retr} F{ev.retract_speed * 60}
        {% endif %}
        M400
        G4 P{(ev.purge_dwell * 1000)|int}
    {% endif %}

    # Escova e wiper. Dois modos (variavel <zona>_mode, so' existe na escova):
    #   0 = linha: passagens alternadas entre o ponto inicial e o final
    #   1 = ziguezague: vai-vem em X entre x0 e x1, avancando em Y de y0 ate
    #       y1 em passos de <zona>_step mm; <zona>_passes = numero de
    #       varrimentos completos (o 2o volta de y1 para y0, etc.)
    {% for zone in ["brush", "wiper"] %}
        {% if cv[p ~ zone ~ "_enable"]|int == 1 %}
            {% set x0 = cv[p ~ zone ~ "_x0"] - org.x %}
            {% set y0 = cv[p ~ zone ~ "_y0"] - org.y %}
            {% set x1 = cv[p ~ zone ~ "_x1"] - org.x %}
            {% set y1 = cv[p ~ zone ~ "_y1"] - org.y %}
            {% set fs = cv[p ~ zone ~ "_speed"] * 60 %}
            {% set passes = cv[p ~ zone ~ "_passes"]|int %}
            {% set mode = cv[p ~ zone ~ "_mode"]|default(0)|int %}
            G1 X{x0} Y{y0} F{ft}
            {% if mode == 1 %}
                {% set step = cv[p ~ zone ~ "_step"]|default(2.0)|float %}
                {% if step <= 0 %}
                    {action_raise_error("Limpeza do T%d: %s_step tem de ser maior do que 0." % (tool, zone))}
                {% endif %}
                {% set n = [((y1 - y0)|abs / step)|round(0, 'ceil')|int, 1]|max %}
                {% set ns = namespace(x=x0) %}
                {% for pss in range(passes) %}
                    {% set ya = y0 if pss % 2 == 0 else y1 %}
                    {% set yb = y1 if pss % 2 == 0 else y0 %}
                    {% for k in range(n + 1) %}
                        {% if k > 0 %}
                            G1 Y{ya + (yb - ya) * k / n} F{fs}
                        {% endif %}
                        {% set ns.x = x1 if ns.x == x0 else x0 %}
                        G1 X{ns.x} F{fs}
                    {% endfor %}
                {% endfor %}
            {% else %}
                {% for i in range(passes) %}
                    {% if i % 2 == 0 %}
                        G1 X{x1} Y{y1} F{fs}
                    {% else %}
                        G1 X{x0} Y{y0} F{fs}
                    {% endif %}
                {% endfor %}
            {% endif %}
        {% endif %}
    {% endfor %}

    # Reposicao (unretract) pedida: e' feita em cima do balde da purga (o que
    # pingar cai no balde), ainda com o prato afastado, antes do regresso.
    {% set do_unretract = purged and retr > 0 and params.UNRETRACT|default(0)|int == 1 %}
    {% if do_unretract %}
        G1 X{cv[p ~ "purge_x"] - org.x} Y{cv[p ~ "purge_y"] - org.y} F{ft}
        M400
        M83
        G1 E{ev.unretract} F{ev.unretract_speed * 60}
        M400
        {% if ev.unretract_dwell > 0 %}
            G4 P{(ev.unretract_dwell * 1000)|int}
        {% endif %}
    {% endif %}

    # Regresso: primeiro X/Y (ainda com o prato afastado), depois Z
    {% if params.RETURN|int == 1 %}
        G1 X{start.x} Y{start.y} F{ft}
        G1 Z{start.z} F{fz}
    {% endif %}
    # Estado da retracao: reposta acima (em cima do balde), ou registada para
    # ser reposta por _CLEAN_UNRETRACT ou compensada na proxima purga.
    {% if purged and retr > 0 %}
        {% if do_unretract %}
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE={p}retracted VALUE=0
        {% else %}
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE={p}retracted VALUE=1
        {% endif %}
    {% elif purged %}
        SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE={p}retracted VALUE=0
    {% endif %}
    M400
    RESTORE_GCODE_STATE NAME=_clean_nozzle MOVE=0

# Repoe a retracao da limpeza, se estiver pendente, na posicao atual. Usado
# imediatamente antes de imprimir (fim do PRINT_START, retomar de uma pausa,
# troca sem limpeza).
[gcode_macro _CLEAN_UNRETRACT]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% if cv["t" ~ tool ~ "_retracted"]|default(0)|int == 1 %}
        _MATERIAL_APPLY TOOL={tool}
        _CLEAN_UNRETRACT_DO TOOL={tool}
    {% endif %}

[gcode_macro _CLEAN_UNRETRACT_DO]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% set ev = cv["eff_t" ~ tool] %}
    SAVE_GCODE_STATE NAME=_clean_unretract
    M83
    G1 E{ev.unretract} F{ev.unretract_speed * 60}
    M400
    {% if ev.unretract_dwell > 0 %}
        G4 P{(ev.unretract_dwell * 1000)|int}
    {% endif %}
    RESTORE_GCODE_STATE NAME=_clean_unretract MOVE=0
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=t{tool}_retracted VALUE=0
