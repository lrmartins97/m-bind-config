# ============================================================================
# impressao/inicio_fim.cfg
# Inicio e fim de uma impressao: PRINT_START (chamado pelo OrcaSlicer),
# linha de purga no prato e PRINT_END.
# ============================================================================

# Opcoes do arranque
[gcode_macro _PRINT_START_VARS]
variable_default_temp: 30       ; Temperatura quando o slicer nao indica nenhuma (C)
variable_clean_at_start: 0      ; 1 = limpar cada ferramenta usada antes de imprimir (limpeza.cfg)
variable_prime_line: 1          ; 1 = linha de purga no prato com a ferramenta inicial (PRIME_EXTRUDER)
variable_calibrate_dual: 0      ; 1 = calibrar sempre (CALIBRATE_IDEX) antes de imprimir com as duas ferramentas
# --- Linha de purga no prato (PRIME_EXTRUDER) ---
variable_prime_max_flow: 5.0      ; Teto do caudal na linha de purga (mm3/s). A 1a linha usa este teto
variable_prime_first_volume: 18.0 ; Pasta que a 1a linha empurra para por a seringa em pressao (mm3), igual para qualquer bico. 0 = sem 1a linha
variable_prime_lines: 2           ; Linhas seguintes, com a forma e o caudal da primeira camada (nunca acima do teto nem do maximo do material no slicer)
variable_prime_width: 1.2         ; Largura dessas linhas = este fator x diametro do bico
variable_prime_max_speed: 20      ; Velocidade maxima na linha de purga (mm/s)
variable_prime_layer: 0.3         ; Altura da linha quando o slicer nao indica a altura da primeira camada (mm)
variable_prime_axis: "y"          ; Direcao das linhas: "y" = ao longo do Y, "x" = ao longo do X
variable_prime_x: 0.6             ; X onde a 1a linha comeca
variable_prime_y: 5               ; Y onde a 1a linha comeca
variable_prime_length: 75         ; Comprimento de cada linha (mm), no sentido positivo do eixo escolhido
variable_prime_side: 1            ; Lado para onde ficam as linhas seguintes, no outro eixo: 1 = sentido positivo, -1 = negativo
variable_skip_next_calibration: 0 ; interno: pedido de CALIBRATE_IDEX_SKIP_NEXT (so para a proxima impressao)
gcode:

# Salta a calibracao automatica SO na proxima impressao com duas ferramentas,
# que usa entao a calibracao guardada (tem de estar valida e final: por exemplo
# feita com CALIBRATE_IDEX XY_MANUAL=1). O pedido perde-se se o Klipper reiniciar.
[gcode_macro CALIBRATE_IDEX_SKIP_NEXT]
description: Proxima impressao com duas ferramentas sem calibracao automatica (usa a calibracao guardada)
gcode:
    SET_GCODE_VARIABLE MACRO=_PRINT_START_VARS VARIABLE=skip_next_calibration VALUE=1
    RESPOND PREFIX="info" MSG="A proxima impressao com duas ferramentas vai usar a calibracao guardada, sem calibrar. Depois disso volta a calibrar sempre."

# Arranque de impressao, para 1 ou 2 ferramentas. Linha no OrcaSlicer
# (Machine start G-code):
#   PRINT_START T0_USED={is_extruder_used[0]} T1_USED={is_extruder_used[1]} INITIAL_TOOL={initial_extruder} TEMP0={nozzle_temperature_initial_layer[0]} TEMP1={nozzle_temperature_initial_layer[1]} MAT0="{filament_settings_id[0]}" MAT1="{filament_settings_id[1]}" NOZZLE0={nozzle_diameter[0]} NOZZLE1={nozzle_diameter[1]} FLOW0={filament_max_volumetric_speed[0]} FLOW1={filament_max_volumetric_speed[1]} LAYER={initial_layer_print_height} SPEED={initial_layer_speed}
# NOZZLE / FLOW / LAYER / SPEED (opcionais): bico, caudal maximo do material,
# altura e velocidade da primeira camada. Servem para a linha de purga
# (PRIME_EXTRUDER). Sem eles usam-se os valores de _PRINT_START_VARS.
# MAT0 / MAT1 (opcionais): nome do perfil de material de cada ferramenta. Se
# for igual ao nome de um material do materiais.cfg, esse material e'
# escolhido; senao avisa e usa os valores do limpeza.cfg.
# Compativel com o formato antigo (HOTEND= / EXTRUDER_TEMP=): sem T0_USED /
# T1_USED, assume uma impressao so com o T0.
[gcode_macro PRINT_START]
gcode:
    {% set pv = printer["gcode_macro _PRINT_START_VARS"] %}
    # O OrcaSlicer manda true/false (outros slicers 1/0): aceita os dois
    {% set t0_raw = params.T0_USED|default("1")|string|lower|trim %}
    {% set t1_raw = params.T1_USED|default("0")|string|lower|trim %}
    {% set t0_used = 1 if t0_raw in ["1", "true", "yes"] else 0 %}
    {% set t1_used = 1 if t1_raw in ["1", "true", "yes"] else 0 %}
    {% set initial = params.INITIAL_TOOL|default(0 if t0_used == 1 else 1)|int %}
    {% set legacy = params.EXTRUDER_TEMP|default(params.HOTEND|default(pv.default_temp))|float %}
    {% set temp0 = params.TEMP0|default(legacy)|float %}
    {% set temp1 = params.TEMP1|default(legacy)|float %}
    {% set calibrate = t1_used == 1 and pv.calibrate_dual|int == 1 and pv.skip_next_calibration|int == 0 %}

    # --- 1. Verificacoes (antes de mexer em qualquer coisa) ---
    {% if t0_used == 0 and t1_used == 0 %}
        {action_raise_error("PRINT_START: o slicer nao indicou nenhuma ferramenta em uso (T0_USED / T1_USED).")}
    {% endif %}
    {% if (initial == 0 and t0_used == 0) or (initial == 1 and t1_used == 0) or initial > 1 %}
        {action_raise_error("PRINT_START: a ferramenta inicial (INITIAL_TOOL) nao esta entre as ferramentas usadas.")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calibration_active VALUE=0
    {% if t1_used == 1 and not calibrate %}
        # Sem calibracao automatica: a calibracao guardada tem de estar valida
        {% set svv = printer.save_variables.variables %}
        RESPOND PREFIX="info" MSG="Calibracao automatica saltada: a usar a calibracao guardada ({svv.tool_1_xy_calibrated_at|default('data desconhecida')})."
        IDEX_CHECK_DUAL_READY
        # O pedido de saltar vale para uma impressao: so e' consumido quando a
        # impressao arranca (se for recusada, continua valido para a seguinte)
        SET_GCODE_VARIABLE MACRO=_PRINT_START_VARS VARIABLE=skip_next_calibration VALUE=0
    {% endif %}

    # --- Materiais indicados pelo slicer (opcional) ---
    {% if t0_used == 1 and params.MAT0|default("")|trim != "" %}
        SET_MATERIAL TOOL=0 MATERIAL="{params.MAT0|trim}" IF_UNKNOWN=DEFAULT
    {% endif %}
    {% if t1_used == 1 and params.MAT1|default("")|trim != "" %}
        SET_MATERIAL TOOL=1 MATERIAL="{params.MAT1|trim}" IF_UNKNOWN=DEFAULT
    {% endif %}

    # --- 2. Estado de partida: sem babystep, T0 ativo ---
    # As trocas de ferramenta do PRINT_START nao disparam a limpeza de troca
    # (a limpeza do arranque e' feita no passo 6, ja com as temperaturas certas).
    _SET_GCODE_OFFSET_BASE Z=0
    SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE=0
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=1
    T0
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=0
    M117 A preparar...

    # --- 3. Aquecer so as ferramentas usadas ---
    {% if t0_used == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder TARGET={temp0}
    {% endif %}
    {% if t1_used == 1 %}
        SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={temp1}
    {% endif %}
    G21
    M220 S100
    M221 S100
    M107
    G90

    # --- 4. Home ---
    M117 Home...
    G28

    # --- 5. Esperar pelas temperaturas ---
    M117 A aquecer...
    {% if t0_used == 1 %}
        TEMPERATURE_WAIT SENSOR=extruder MINIMUM={temp0}
    {% endif %}
    {% if t1_used == 1 %}
        TEMPERATURE_WAIT SENSOR=extruder1 MINIMUM={temp1}
    {% endif %}
    TIMELAPSE_TAKE_FRAME

    # --- 5b. Calibracao entre ferramentas (so com as duas ferramentas) ---
    # As trocas de ferramenta da calibracao nao fazem a limpeza de troca: a
    # calibracao limpa os dois bicos no inicio (clean_before_calibration).
    {% if calibrate %}
        M117 A calibrar...
        RESPOND PREFIX="info" MSG="A calibrar as duas ferramentas antes de imprimir. Se a calibracao falhar, a impressao sera cancelada. Para imprimir com a calibracao guardada, usa CALIBRATE_IDEX_SKIP_NEXT e volta a iniciar."
        SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calibration_active VALUE=1
        CALIBRATE_IDEX
        SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calibration_active VALUE=0
        IDEX_CHECK_DUAL_READY
    {% endif %}

    # --- 6. Limpeza: primeiro a outra ferramenta, por ultimo a inicial, que
    #        fica ativa (assim nao ha mais nenhuma troca antes de imprimir) ---
    {% if pv.clean_at_start|int == 1 %}
        M117 A limpar...
        {% if initial == 0 and t1_used == 1 %}
            CLEAN_NOZZLE TOOL=1 RETURN=0
        {% elif initial == 1 and t0_used == 1 %}
            CLEAN_NOZZLE TOOL=0 RETURN=0
        {% endif %}
        # A inicial repoe a retracao em cima do balde, no fim da limpeza
        CLEAN_NOZZLE TOOL={initial} RETURN=0 UNRETRACT=1
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=1
    T{initial}
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=skip_toolchange_clean VALUE=0
    # Se ainda houver uma retracao por repor na ferramenta inicial (ex.: sem
    # limpeza no arranque, depois da calibracao), repoe-a agora. A outra
    # ferramenta repoe (ou compensa na purga) quando entrar pela primeira vez.
    _CLEAN_UNRETRACT TOOL={initial}

    # --- 7. Linha de purga com a ferramenta inicial ---
    M83
    G92 E0
    {% if pv.prime_line|int == 1 %}
        M117 Linha de purga
        # Dados do slicer para a ferramenta inicial (0 = nao indicado)
        PRIME_EXTRUDER NOZZLE={params["NOZZLE" ~ initial]|default(0)|float} FLOW={params["FLOW" ~ initial]|default(0)|float} LAYER={params.LAYER|default(0)|float} SPEED={params.SPEED|default(0)|float}
    {% endif %}
    G92 E0
    M400
    M117 A imprimir

# ----------------------------------------------------------------------------
# Linha de purga no prato, com a ferramenta inicial (prime_line)
# ----------------------------------------------------------------------------
# 1a linha: poe a seringa em pressao. Empurra sempre a mesma quantidade de
#   pasta (prime_first_volume), seja qual for o bico, ao caudal
#   prime_max_flow (o teto da maquina) e sem passar de prime_max_speed.
# Linhas seguintes (prime_lines): imitam a primeira camada da peca, com a
#   mesma altura, largura proporcional ao bico e o mesmo caudal, para a peca
#   comecar com a pressao certa. O caudal delas nunca passa de prime_max_flow
#   nem do maximo do material no slicer.
# O bico, a altura e a velocidade da primeira camada vem do OrcaSlicer, pelo
# PRINT_START. Sem eles: bico = nozzle_diameter do Klipper, altura =
# prime_layer, velocidade = prime_max_speed.
# As linhas comecam em prime_x / prime_y e seguem o eixo prime_axis; as
# seguintes ficam ao lado da primeira (prime_side).
# As opcoes estao em _PRINT_START_VARS, no topo deste ficheiro. Para
# experimentar uma alteracao sem imprimir: PRIME_EXTRUDER na consola, com a
# maquina em home.
[gcode_macro PRIME_EXTRUDER]
description: Linha de purga no prato. NOZZLE= LAYER= SPEED= FLOW= (opcionais, normalmente vem do PRINT_START)
gcode:
    {% set pv = printer["gcode_macro _PRINT_START_VARS"] %}
    {% set cfg = printer.configfile.settings[printer.toolhead.extruder] %}
    {% set area = 3.14159265 * (cfg.filament_diameter|float / 2) ** 2 %}

    # --- Dados do slicer, ou os valores por omissao ---
    {% set nozzle = params.NOZZLE|default(0)|float %}
    {% if nozzle < 0.1 or nozzle > 3.0 %}
        {% set nozzle = cfg.nozzle_diameter|float %}
    {% endif %}
    {% set layer = params.LAYER|default(0)|float %}
    {% if layer <= 0 %}
        {% set layer = pv.prime_layer|float %}
    {% endif %}
    {% set layer = [[layer, 0.1]|max, nozzle]|min %}
    {% set vmax = pv.prime_max_speed|float %}
    {% set speed = params.SPEED|default(0)|float %}
    {% if speed <= 0 or speed > vmax %}
        {% set speed = vmax %}
    {% endif %}
    {% set qtop = pv.prime_max_flow|float %}
    {% set qmax = qtop %}
    {% set qmat = params.FLOW|default(0)|float %}
    {% if qmat > 0 and qmat < qmax %}
        {% set qmax = qmat %}
    {% endif %}

    # --- Linhas com a forma da primeira camada: caudal = seccao x velocidade ---
    {% set width = pv.prime_width|float * nozzle %}
    {% set section = width * layer %}
    {% if section * speed > qmax %}
        {% set speed = qmax / section %}
    {% endif %}
    {% set flow = section * speed %}
    # --- Geometria: A = eixo das linhas, B = o outro eixo ---
    {% set axis = pv.prime_axis|string|lower|trim %}
    {% if axis not in ["x", "y"] %}
        {action_raise_error("PRIME_EXTRUDER: prime_axis tem de ser \"x\" ou \"y\".")}
    {% endif %}
    {% set A = "Y" if axis == "y" else "X" %}
    {% set B = "X" if axis == "y" else "Y" %}
    {% set a0 = (pv.prime_y if axis == "y" else pv.prime_x)|float %}
    {% set b0 = (pv.prime_x if axis == "y" else pv.prime_y)|float %}
    {% set length = pv.prime_length|float|abs %}
    {% if length < 1 %}
        {action_raise_error("PRIME_EXTRUDER: prime_length tem de ser pelo menos 1 mm.")}
    {% endif %}
    {% set a1 = a0 + length %}
    {% set side = -1 if pv.prime_side|float < 0 else 1 %}
    {% set lines = pv.prime_lines|int %}
    {% set e_line = section * length / area %}

    # --- 1a linha: quantidade fixa, ao teto da maquina ---
    {% set preload = pv.prime_first_volume|float %}
    {% set v_pre = [vmax, qtop * length / preload]|min if preload > 0 else 0 %}
    {% set q_pre = preload * v_pre / length %}
    {% set w_pre = [preload / length / layer, nozzle]|max %}
    {% set total = preload + lines * section * length %}
    RESPOND PREFIX="info" MSG="Linha de purga: bico {'%.2f' % nozzle} mm, camada {'%.2f' % layer} mm. 1a linha a {'%.1f' % q_pre} mm3/s, seguintes a {'%.1f' % flow} mm3/s ({'%.1f' % speed} mm/s). {'%.0f' % total} mm3 de pasta."

    {% set ns = namespace(a=a0, b=b0) %}
    G90
    M83
    G92 E0
    G1 X{'%.3f' % pv.prime_x|float} Y{'%.3f' % pv.prime_y|float} F10000
    G1 Z{'%.3f' % layer} F600
    {% if preload > 0 %}
        G1 {A}{'%.3f' % a1} E{'%.5f' % (preload / area)} F{'%.1f' % (v_pre * 60)}
        {% set ns.a = a1 %}
        {% set ns.b = ns.b + side * ((w_pre + width) / 2 + 0.3) %}
    {% endif %}
    {% for i in range(lines) %}
        G1 {B}{'%.3f' % ns.b} F2400
        {% set ns.a = a0 if ns.a == a1 else a1 %}
        G1 {A}{'%.3f' % ns.a} E{'%.5f' % e_line} F{'%.1f' % (speed * 60)}
        {% set ns.b = ns.b + side * (width + 0.3) %}
    {% endfor %}
    G92 E0
    G1 Z{'%.3f' % ([2.0, layer + 1.0]|max)} F600

[gcode_macro PRINT_END]
gcode:
    # 1. Desligar Aquecimento
    TURN_OFF_HEATERS
    M104 S0 T0
    M104 S0 T1
    M140 S0

    # 2. Desligar Ventoinhas (incluindo a Chamber_Fan)
    M107
    SET_FAN_SPEED FAN=Chamber_Fan SPEED=0
    {% if printer["fan_generic fan_t0"] is defined %}
        SET_FAN_SPEED FAN=fan_t0 SPEED=0
    {% endif %}
    {% if printer["fan_generic fan_t1"] is defined %}
        SET_FAN_SPEED FAN=fan_t1 SPEED=0
    {% endif %}

    # 3. Movimentação de Segurança
    G91                                    
    G1 Z3 F3000                            # Sobe apenas 3mm
    G90                                    

    # 4. Estacionar Cabeças (Home X e Y)
    G28 X Y                                
    
    # 5. Finalização
    M84                                    
    {action_respond_info("Fim da impressão")}
