# ============================================================================
# impressao/troca_ferramenta.cfg
# Troca entre as duas ferramentas (IDEX): T0 e T1, parque de cada cabeca,
# offsets do T1, babystep e home (G28).
#
# _idex_vars tem as posicoes de parque e tambem a posicao da camara de
# calibracao, que as macros de calibracao vao buscar aqui.
# ============================================================================

# Variáveis centralizadas para o IDEX (Parques, Z-hop e Velocidades)
[gcode_macro _idex_vars]
variable_hop_mm: 6             ; Altura do Z-hop no parqueamento
variable_hop_speed: 10           ; Velocidade do Z-hop (mm/s) -> 10 * 60 = 600 mm/min
variable_park_speed: 100         ; Velocidade de deslocação para o parque em X (mm/s) -> 100 * 60 = 6000 mm/min
variable_park_t0_x: -75          ; Posição X de parqueamento da Ferramenta 0 (Esquerda)
variable_park_t1_x: 175          ; Posição X de parqueamento da Ferramenta 1 (Direita)
# --- Camara do bico (fonte UNICA: usada pelo kTAMV e pela calibracao manual) ---
variable_camera_x: 22            ; X da cabeca com o bico centrado na camara
variable_camera_y: 113           ; Y da cabeca com o bico centrado na camara
variable_camera_z: 6.7           ; Z de foco (camara no prato: o Z define o foco). Margem medida: 6.4 a 7.0 (24/09, camara nova com difusor)
variable_camera_travel_speed: 100 ; Velocidade X/Y ate a camara (mm/s)
variable_camera_led: 1.0         ; Intensidade do anel de LEDs da camara durante as medicoes (0 a 1)
variable_calib_tool_cams_off: 0  ; 1 = desligar as camaras das ferramentas durante as medicoes; 0 = deixa-las ligadas (a luz delas revela a borda da agulha)
variable_camera_z_speed: 10      ; Velocidade Z ate a altura de foco (mm/s)
gcode:

# Helper script to park the carriage (called from T0 and T1 macros)
[gcode_macro PARK_extruder]
gcode:
    {% set uv = printer["gcode_macro _idex_vars"] %}
    {% set hop = uv.hop_mm %}
    {% set did_hop = printer.toolhead.position.z + hop <= printer.toolhead.axis_maximum.z %}
    
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_EXTRUDER_0
    SAVE_GCODE_STATE NAME=park0
    G90
    
    # Sobe e vai para o parque, mas FICA EM CIMA (não desce no parque)
    {% if did_hop %}
        G91
        G1 Z{hop} F{uv.hop_speed * 60}
        G90
    {% endif %}
    
    # Move para o parque da T0 usando a variável configurada
    G1 X{uv.park_t0_x} F{uv.park_speed * 60}
    
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_EXTRUDER_0 MOVE=0
    RESTORE_GCODE_STATE NAME=park0 MOVE=0

[gcode_macro PARK_extruder1]
gcode:
    {% set uv = printer["gcode_macro _idex_vars"] %}
    {% set hop = uv.hop_mm %}
    {% set did_hop = printer.toolhead.position.z + hop <= printer.toolhead.axis_maximum.z %}
    
    SAVE_DUAL_CARRIAGE_STATE NAME=PARK_EXTRUDER_1
    SAVE_GCODE_STATE NAME=park1
    G90
    
    # Sobe e vai para o parque, mas FICA EM CIMA (não desce no parque)
    {% if did_hop %}
        G91
        G1 Z{hop} F{uv.hop_speed * 60}
        G90
    {% endif %}
    
    # Move para o parque da T1 usando a variável configurada
    G1 X{uv.park_t1_x} F{uv.park_speed * 60}
    
    RESTORE_DUAL_CARRIAGE_STATE NAME=PARK_EXTRUDER_1 MOVE=0
    RESTORE_GCODE_STATE NAME=park1 MOVE=0

# ----------------------------------------------------------------------------
# Preservacao do babystep atraves de trocas de ferramenta
# ----------------------------------------------------------------------------
# _TOOLZ.applied = offset de FERRAMENTA embutido no gcode offset (0 para T0,
# tool_1_z_offset para T1). Em cada troca recuperamos o babystep real:
#     babystep = homing_origin.z (atual) - applied
# e reaplicamos: offset novo = offset_da_ferramenta_nova + babystep.
# Assim o babystep sobrevive a qualquer numero de trocas de ferramenta.
# ----------------------------------------------------------------------------
[gcode_macro _TOOLZ]
variable_applied: 0.0
gcode:

# ----------------------------------------------------------------------------
# Protecao do offset Z da ferramenta
# ----------------------------------------------------------------------------
# Com o T1 ativo, o offset Z do G-code = offset do T1 + babystep. Os botoes de
# "pôr o offset a zero" do KlipperScreen e do Mainsail mandam
# SET_GCODE_OFFSET Z=0, que apagava tambem o offset do T1 e punha o bico do
# T1 abaixo do sitio certo (a bater na peca/prato).
# Aqui, Z= passa a ser o BABYSTEP: Z=0 repoe o babystep a zero e mantem o
# offset da ferramenta ativa. Z_ADJUST, X, Y e MOVE funcionam como sempre.
# As macros internas (T0/T1, PRINT_START) usam o comando original,
# _SET_GCODE_OFFSET_BASE, que define o offset total.
# ----------------------------------------------------------------------------
[gcode_macro SET_GCODE_OFFSET]
rename_existing: _SET_GCODE_OFFSET_BASE
description: Offset G-code. Z= e' o babystep: o offset Z da ferramenta ativa (T1) e' mantido
gcode:
    {% set applied = printer["gcode_macro _TOOLZ"].applied|float %}
    {% set args = [] %}
    {% for k, v in params.items() %}
        {% if k|upper == "Z" %}
            {% set _ = args.append("Z=%.6f" % (applied + v|float)) %}
        {% else %}
            {% set _ = args.append("%s=%s" % (k|upper, v)) %}
        {% endif %}
    {% endfor %}
    _SET_GCODE_OFFSET_BASE {args|join(" ")}

# ----------------------------------------------------------------------------
# Regresso a altura de impressao depois de uma troca de ferramenta
# ----------------------------------------------------------------------------
# O parque afasta o prato (hop_mm) e a limpeza tambem; o slicer nao volta a
# mandar o Z depois do T0/T1 (so' X/Y), por isso sem isto a ferramenta nova
# imprimia no ar. Volta a altura G-code de antes da troca, ja com o offset da
# ferramenta nova (a ponta nova fica a altura certa da camada). So' e' usado
# durante uma impressao; fora dela a troca fica em cima, como sempre.
# ----------------------------------------------------------------------------
[gcode_macro _TOOLCHANGE_RESTORE_Z]
gcode:
    {% set uv = printer["gcode_macro _idex_vars"] %}
    SAVE_GCODE_STATE NAME=_tc_restore_z
    G90
    G1 Z{params.Z|float} F{uv.hop_speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=_tc_restore_z MOVE=0

# ----------------------------------------------------------------------------
# Estado da ferramenta sempre de acordo com o carro ativo
# ----------------------------------------------------------------------------
# O home (G28) deixa o T0 ativo (carro 0), mas os offsets X/Y/Z e o extrusor
# ativo ficavam os do T1 se o T1 estivesse ativo antes: a cabeca ia para o
# sitio errado e o G-code de extrusao mexia no embolo do T1. _TOOL_STATE_SYNC
# poe offsets, extrusor e _TOOLZ de acordo com o carro que esta ativo,
# mantendo o babystep. E' chamado no fim de cada G28 e quando se pede a
# ferramenta que ja esta ativa.
# ----------------------------------------------------------------------------
[gcode_macro _TOOL_STATE_SYNC]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tz = printer["gcode_macro _TOOLZ"] %}
    {% set baby = printer.gcode_move.homing_origin.z - tz.applied|float %}
    {% if printer.dual_carriage["carriage_1"] == "PRIMARY" %}
        {% set t1_x = svv.tool_1_x_offset|default(0)|float %}
        {% set t1_y = svv.tool_1_y_offset|default(0)|float %}
        {% set t1_z = svv.tool_1_z_offset|default(0)|float + svv.tool_1_z_trim|default(0)|float %}
        {% if printer.toolhead.extruder != "extruder1" %}
            ACTIVATE_EXTRUDER EXTRUDER=extruder1
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1
        {% endif %}
        _SET_GCODE_OFFSET_BASE X={t1_x} Y={t1_y} Z={t1_z + baby}
        SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE={t1_z}
    {% else %}
        {% if printer.toolhead.extruder != "extruder" %}
            ACTIVATE_EXTRUDER EXTRUDER=extruder
            SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder
        {% endif %}
        _SET_GCODE_OFFSET_BASE X=0 Y=0 Z={baby}
        SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE=0
    {% endif %}

[gcode_macro G28]
rename_existing: G928
description: Home. No fim, offsets e extrusor ficam de acordo com a ferramenta ativa
gcode:
    G928 {rawparams}
    _TOOL_STATE_SYNC

# Activate the primary extruder
[gcode_macro T0]
gcode:
    {% set tz = printer["gcode_macro _TOOLZ"] %}
    {% set baby = printer.gcode_move.homing_origin.z - tz.applied %}
    # Altura G-code antes da troca: numa impressao, o slicer nao volta a
    # mandar o Z depois da troca, por isso a troca tem de voltar a ela
    {% set pre_z = printer.gcode_move.gcode_position.z %}
    {% if printer.dual_carriage["carriage_0"] != "PRIMARY" %}
      PARK_extruder1
      ACTIVATE_EXTRUDER EXTRUDER=extruder 
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder MOTION_QUEUE=extruder 
      SET_DUAL_CARRIAGE CARRIAGE=0
      _SET_GCODE_OFFSET_BASE X=0 Y=0 Z={baby}
      SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE=0

      {% if printer.virtual_sdcard.is_active and printer.idle_timeout.state == 'Printing'%}
        M400
        # Limpa a ferramenta que entra (purga no balde, escova, wiper), se a
        # limpeza nas trocas estiver ligada: ver limpeza.cfg
        _TOOLCHANGE_CLEAN TOOL=0
        M400
        _TOOLCHANGE_RESTORE_Z Z={pre_z}
      {% endif %}
      
    {% else %}
      # O T0 ja esta ativo: garante offsets (X/Y a zero, Z so' babystep) e
      # extrusor do T0, mesmo que tenham ficado os do T1 por engano.
      _TOOL_STATE_SYNC
    {% endif %}

[gcode_macro T1]
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set tz = printer["gcode_macro _TOOLZ"] %}
    {% set baby = printer.gcode_move.homing_origin.z - tz.applied %}
    # Altura G-code antes da troca (ver T0)
    {% set pre_z = printer.gcode_move.gcode_position.z %}
    {% if printer.dual_carriage["carriage_1"] != "PRIMARY" %}
      PARK_extruder
      ACTIVATE_EXTRUDER EXTRUDER=extruder1 
      SYNC_EXTRUDER_MOTION EXTRUDER=extruder1 MOTION_QUEUE=extruder1 
      SET_DUAL_CARRIAGE CARRIAGE=1
      # Valores por defeito (0) para maquinas ainda sem calibracao entre
      # ferramentas: sem eles, o T1 da erro com o variables.cfg vazio.
      {% set t1_x = svv.tool_1_x_offset|default(0)|float %}
      {% set t1_y = svv.tool_1_y_offset|default(0)|float %}
      {% set t1_z = svv.tool_1_z_offset|default(0)|float %}
      # Ajuste fino da altura do T1 (IDEX_Z_TRIM_T1): soma-se ao offset
      # medido na calibracao e nao e' mexido por ela
      {% set t1_trim = svv.tool_1_z_trim|default(0)|float %}
      _SET_GCODE_OFFSET_BASE X={t1_x} Y={t1_y} Z={t1_z + t1_trim + baby}
      SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE={t1_z + t1_trim}

      {% if printer.virtual_sdcard.is_active and printer.idle_timeout.state == 'Printing'%}
        M400
        # Limpa a ferramenta que entra (purga no balde, escova, wiper), se a
        # limpeza nas trocas estiver ligada: ver limpeza.cfg
        _TOOLCHANGE_CLEAN TOOL=1
        M400
        _TOOLCHANGE_RESTORE_Z Z={pre_z}
      {% endif %}
    {% else %}
      # O T1 ja esta ativo: garante offsets e extrusor do T1
      _TOOL_STATE_SYNC
    {% endif %}

# ----------------------------------------------------------------------------
# Limpeza na troca de ferramenta (opcoes em limpeza.cfg)
# ----------------------------------------------------------------------------

# Chamado pelo T0/T1 depois de ativarem a ferramenta, durante a impressao
[gcode_macro _TOOLCHANGE_CLEAN]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% set p = "t" ~ tool ~ "_" %}
    {% set any_zone = cv[p ~ "purge_enable"]|int == 1 or cv[p ~ "brush_enable"]|int == 1 or cv[p ~ "wiper_enable"]|int == 1 %}
    {% if cv.skip_toolchange_clean|int == 1 or cv.calibration_active|int == 1 %}
        # A troca foi pedida pelo proprio CLEAN_NOZZLE (que limpa a seguir) ou
        # faz parte da calibracao automatica do PRINT_START (que limpa no inicio)
    {% elif cv.clean_on_toolchange|int == 1 and any_zone %}
        # Limpa, repoe em cima do balde e volta ao ponto de partida (o parque).
        # Sem afastar mais o prato: o caminho parque -> estacoes -> parque
        # e' todo fora do prato.
        CLEAN_NOZZLE TOOL={tool} RETURN=1 UNRETRACT=1 LIFT=0
    {% elif cv.clean_on_toolchange|int == 1 %}
        # Limpeza nas trocas ligada, mas esta ferramenta nao tem nenhuma
        # estacao ativa: nao purga fora do balde (deixaria uma gota na ponta).
        # Avisa uma vez por sessao do Klipper.
        {% if cv[p ~ "warned"]|default(0)|int == 0 %}
            RESPOND TYPE=echo MSG="Aviso: troca para o T{tool} sem limpeza (nenhuma estacao ativa em _CLEAN_VARS)."
            SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE={p}warned VALUE=1
        {% endif %}
    {% endif %}
    # Sem limpeza nesta troca: se a ferramenta tiver uma retracao da limpeza
    # por repor (ex.: do PRINT_START), repoe-a agora, antes de imprimir. A
    # retracao normal da troca fica a cargo do slicer.
    {% if not (cv.skip_toolchange_clean|int == 1 or cv.calibration_active|int == 1) and not (cv.clean_on_toolchange|int == 1 and any_zone) %}
        _CLEAN_UNRETRACT TOOL={tool}
    {% endif %}
