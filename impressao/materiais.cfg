# ---------------------------------------------------------------------------
# Uso interno e comando SET_MATERIAL (nao apagar)
# ---------------------------------------------------------------------------
# O material escolhido para cada ferramenta fica gravado em variables.cfg
# (tool_0_material, tool_1_material; 0 = nenhum). Cada valor que o material
# define substitui o da ferramenta; o que nao define continua a vir do
# limpeza.cfg. Sem materiais definidos tudo funciona com esses valores.
# ---------------------------------------------------------------------------

# Que valores da limpeza vieram do material (para o SET_MATERIAL os mostrar)
[gcode_macro _MATERIAL_STATE]
variable_src_t0: []
variable_src_t1: []
gcode:

# Calcula os valores em uso de uma ferramenta (eff_t0 / eff_t1).
# SLOT= (opcional) calcula com outro material, sem o gravar: o SET_MATERIAL
# usa-o para verificar um material antes de o escolher.
[gcode_macro _MATERIAL_APPLY]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% set p = "t" ~ tool ~ "_" %}
    {% set saved = printer.save_variables.variables["tool_" ~ tool ~ "_material"]|default(0)|int %}
    {% set slot = params.SLOT|default(saved)|int %}
    {% set mk = "gcode_macro _MATERIAL_" ~ slot %}
    {% set has = slot > 0 and mk in printer %}
    {% set mat = printer[mk] if has else {} %}
    {% if slot > 0 and not has and cv.mat_warned|int == 0 %}
        RESPOND TYPE=echo MSG="Aviso: o T{tool} tem o material {slot} escolhido, mas esse material nao existe (materiais.cfg). A usar os valores do limpeza.cfg."
        SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=mat_warned VALUE=1
    {% endif %}
    # nome no material -> nome da variavel da ferramenta (limpeza.cfg)
    {% set keys = {"purge_amount": "purge_amount", "purge_speed": "purge_speed", "purge_dwell": "purge_dwell", "retract": "purge_retract", "retract_speed": "purge_retract_speed", "unretract": "unretract", "unretract_speed": "unretract_speed", "unretract_dwell": "unretract_dwell", "resume_purge_amount": "resume_purge_amount"} %}
    {% set d = {} %}
    {% set src = [] %}
    {% for k, tk in keys.items() %}
        {% set _ = d.update({k: (mat[k] if k in mat else cv[p ~ tk])|float}) %}
        {% if k in mat %}
            {% set _ = src.append(k) %}
        {% endif %}
    {% endfor %}
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=eff_t{tool} VALUE="{d}"
    SET_GCODE_VARIABLE MACRO=_MATERIAL_STATE VARIABLE=src_t{tool} VALUE="{src}"

# Verifica os valores em uso de uma ferramenta (calculados por _MATERIAL_APPLY
# imediatamente antes) e mostra-os. Um valor invalido para tudo com um erro
# que diz qual e onde se corrige, antes de a limpeza o tentar usar.
[gcode_macro _MATERIAL_REPORT]
gcode:
    {% set tool = params.TOOL|int %}
    {% set ev = printer["gcode_macro _CLEAN_VARS"]["eff_t" ~ tool] %}
    {% set src = printer["gcode_macro _MATERIAL_STATE"]["src_t" ~ tool] %}
    {% set saved = printer.save_variables.variables["tool_" ~ tool ~ "_material"]|default(0)|int %}
    {% set slot = params.SLOT|default(saved)|int %}
    {% set mk = "gcode_macro _MATERIAL_" ~ slot %}
    {% set has = slot > 0 and mk in printer %}
    {% if has %}
        {% set nome = printer[mk].name|default("Material " ~ slot)|string ~ " (" ~ slot ~ ")" %}
    {% elif slot > 0 %}
        {% set nome = "material " ~ slot ~ ", que nao existe" %}
    {% else %}
        {% set nome = "sem material" %}
    {% endif %}
    {% set labels = {"purge_amount": "purga", "purge_speed": "velocidade da purga", "purge_dwell": "espera da purga", "retract": "retracao", "retract_speed": "velocidade da retracao", "unretract": "reposicao", "unretract_speed": "velocidade da reposicao", "unretract_dwell": "espera da reposicao", "resume_purge_amount": "purga ao retomar"} %}
    {% set must_pos = ["purge_speed", "retract_speed", "unretract_speed"] %}
    {% for k in labels %}
        {% set v = ev[k]|float %}
        {% if (k in must_pos and v <= 0) or v < 0 %}
            {% set fonte = ("materiais.cfg, no material " ~ nome) if k in src else ("limpeza.cfg, nos valores do T" ~ tool) %}
            {% set regra = "tem de ser maior do que 0" if k in must_pos else "nao pode ser negativo" %}
            {action_raise_error("T%d: %s = %s nao e' valido (%s). Corrige em %s." % (tool, k, v, regra, fonte))}
        {% endif %}
    {% endfor %}
    RESPOND PREFIX="info" MSG="T{tool}: {nome}. Limpeza: purga {'%.2f' % ev.purge_amount} mm a {'%.2f' % ev.purge_speed} mm/s, espera {'%.0f' % ev.purge_dwell} s; retracao {'%.2f' % ev.retract} mm a {'%.2f' % ev.retract_speed} mm/s; reposicao {'%.2f' % ev.unretract} mm a {'%.2f' % ev.unretract_speed} mm/s, espera {'%.0f' % ev.unretract_dwell} s; ao retomar, purga {'%.2f' % ev.resume_purge_amount} mm."
    {% if has %}
        {% if src|length == 0 %}
            RESPOND PREFIX="info" MSG="T{tool}: este material nao tem valores proprios, fica tudo como no limpeza.cfg."
        {% else %}
            {% set nl = namespace(l=[]) %}
            {% for k in src %}
                {% set nl.l = nl.l + [labels[k]] %}
            {% endfor %}
            RESPOND PREFIX="info" MSG="T{tool}: vem do material: {nl.l|join(', ')}. O resto vem do limpeza.cfg."
        {% endif %}
    {% endif %}

# Campos no Mainsail / KlipperScreen: TOOL (0 ou 1) e MATERIAL (numero, nome
# ou 0 = nenhum). Com os campos vazios mostra o material de cada seringa.
# Antes de gravar a escolha verifica os valores do material; se algum for
# invalido, da erro e a escolha anterior fica como estava.
# IF_UNKNOWN e' so' para o PRINT_START (material do slicer que nao existe:
# avisa em vez de dar erro). Fica escrito como params["..."] para nao aparecer
# como campo nos ecras.
[gcode_macro SET_MATERIAL]
description: Escolhe a pasta de cada seringa (para a limpeza usar os valores dela). TOOL = 0 ou 1, MATERIAL = numero, nome ou 0. Vazio: mostra o atual
gcode:
    # Estas duas linhas so' servem para os ecras mostrarem a ajuda nos campos
    {% set _hint_tool = params.TOOL|default("0 ou 1") %}
    {% set _hint_material = params.MATERIAL|default("numero ou nome") %}
    {% set slots = {} %}
    {% for i in range(1, 21) %}
        {% if ("gcode_macro _MATERIAL_" ~ i) in printer %}
            {% set _ = slots.update({i: printer["gcode_macro _MATERIAL_" ~ i].name|default("Material " ~ i)|string}) %}
        {% endif %}
    {% endfor %}
    {% set nl = namespace(l=[]) %}
    {% for i, n in slots.items() %}
        {% set nl.l = nl.l + ["%d = %s" % (i, n)] %}
    {% endfor %}
    {% set lista = nl.l|join(", ") if slots else "nenhum definido (materiais.cfg)" %}
    {% set no_tool = "TOOL" not in params or params["TOOL"]|string|trim == "" %}
    {% set wanted = params["MATERIAL"]|default("")|string|trim %}
    {% if no_tool and wanted != "" %}
        {action_raise_error("SET_MATERIAL: indica tambem a seringa em TOOL (0 ou 1).")}
    {% endif %}

    {% if no_tool %}
        # --- So' mostrar ---
        {% for t in [0, 1] %}
            _MATERIAL_APPLY TOOL={t}
            _MATERIAL_REPORT TOOL={t}
        {% endfor %}
        RESPOND PREFIX="info" MSG="Materiais disponiveis: {lista}"
    {% else %}
        # --- Escolher ---
        {% set t = params["TOOL"]|int(-1) %}
        {% if t not in [0, 1] %}
            {action_raise_error("SET_MATERIAL: indica TOOL=0 ou TOOL=1.")}
        {% endif %}
        {% set ns = namespace(found=-1, hits=[]) %}
        {% if wanted == "" or wanted == "0" or wanted|lower in ["nenhum", "none", "-"] %}
            {% set ns.found = 0 %}
        {% elif wanted.isdigit() and wanted|int in slots %}
            {% set ns.found = wanted|int %}
        {% else %}
            {% for i, n in slots.items() %}
                {% if n|trim|lower == wanted|lower %}
                    {% set ns.hits = ns.hits + [i] %}
                {% endif %}
            {% endfor %}
            {% if ns.hits|length > 1 %}
                {action_raise_error("SET_MATERIAL: ha mais do que um material com o nome '%s' (numeros %s). Muda um dos nomes em materiais.cfg, ou escolhe pelo numero." % (wanted, ns.hits|join(", ")))}
            {% elif ns.hits|length == 1 %}
                {% set ns.found = ns.hits[0] %}
            {% endif %}
        {% endif %}
        {% if ns.found < 0 %}
            {% if params["IF_UNKNOWN"]|default("ERROR")|upper == "DEFAULT" %}
                RESPOND TYPE=echo MSG="Aviso: o material '{wanted}' do T{t} nao existe em materiais.cfg. A usar os valores do limpeza.cfg."
                {% set ns.found = 0 %}
            {% else %}
                {action_raise_error("SET_MATERIAL: o material '%s' nao existe. Disponiveis: %s" % (wanted, lista))}
            {% endif %}
        {% endif %}
        # Verifica antes de gravar: se der erro, a escolha anterior fica
        _MATERIAL_APPLY TOOL={t} SLOT={ns.found}
        _MATERIAL_REPORT TOOL={t} SLOT={ns.found}
        SAVE_VARIABLE VARIABLE=tool_{t}_material VALUE={ns.found}
    {% endif %}
