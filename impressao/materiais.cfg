# ============================================================================
# impressao/materiais.cfg
# Materiais / pastas: valores de purga, retracao e reposicao por material, e o
# comando para escolher o material de cada ferramenta (SET_MATERIAL).
# ============================================================================
#
# Os materiais sao opcionais: a maquina funciona sem nenhum definido (podes
# apagar todos os blocos _MATERIAL_n; o resto do ficheiro tem de ficar).
# Os valores normais estao em limpeza.cfg (_CLEAN_VARS), por ferramenta.
# Um material so' substitui os valores que define aqui; o que nao define
# continua a vir do limpeza.cfg.
# Um material sem valores (como vem) da exatamente o mesmo resultado que nao
# ter material nenhum.
#
# ESCOLHER O MATERIAL DE CADA FERRAMENTA
#   SET_MATERIAL TOOL=0 MATERIAL=1            (pelo numero)
#   SET_MATERIAL TOOL=1 MATERIAL="Pasta 2"    (pelo nome)
#   SET_MATERIAL TOOL=0 MATERIAL=0            (nenhum: valores do limpeza.cfg)
#   SET_MATERIAL                              (mostra o material de cada ferramenta)
# Ao escolher (e ao mostrar), a consola diz os valores que a limpeza vai usar
# e quais vem do material. Um valor invalido (velocidade 0 ou negativa,
# quantidade ou espera negativa) da erro e a escolha nao e' gravada.
# A escolha fica gravada (variables.cfg) e sobrevive a reinicios.
#
# AUTOMATICO PELO ORCASLICER: se no PRINT_START forem passados os nomes dos
# perfis de material (MAT0= / MAT1=, ver inicio_fim.cfg) e um deles for igual ao
# 'name' de um material daqui (maiusculas/minusculas nao contam), esse
# material e' escolhido sozinho. Se nao existir, avisa e usa os valores do
# limpeza.cfg; a impressao continua.
#
# RENOMEAR: muda o 'name' (ex.: "Alginato 3%"). O numero do bloco
# (_MATERIAL_1, _MATERIAL_2, ...) nao muda.
# MAIS MATERIAIS: copia um bloco e usa o numero seguinte (ate 20).
#
# VALORES QUE UM MATERIAL PODE DEFINIR (tira o '#' so' dos que queres mudar):
#   purge_amount         avanco do embolo na purga (mm)
#   purge_speed          velocidade do embolo na purga (mm/s)
#   purge_dwell          espera depois da purga e da retracao (s)
#   retract              retracao depois da purga (mm; 0 = sem retracao)
#   retract_speed        velocidade da retracao (mm/s)
#   unretract            reposicao antes de voltar a imprimir (mm; pode ser
#                        menor ou maior do que a retracao)
#   unretract_speed      velocidade da reposicao (mm/s)
#   unretract_dwell      espera depois da reposicao, antes de seguir (s; 0 = sem espera)
#   resume_purge_amount  purga ao retomar depois de uma pausa (mm)
# ============================================================================
[gcode_macro _MATERIAL_1]
variable_name: "Pasta Amido"
#variable_purge_amount: 1.0
#variable_purge_speed: 0.2
#variable_purge_dwell: 16
#variable_retract: 0.9
#variable_retract_speed: 0.5
#variable_unretract: 0.9
#variable_unretract_speed: 0.5
#variable_unretract_dwell: 5
#variable_resume_purge_amount: 1.0
