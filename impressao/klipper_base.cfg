# ============================================================================
# impressao/klipper_base.cfg
# O que o Klipper, o Mainsail e o slicer precisam para funcionar: seccoes
# de base, comandos que o slicer manda e esta maquina trata de outra
# maneira, e pequenos comandos de apoio usados pelas outras macros.
# ============================================================================

# Essenciais para a interface do Mainsail saber o estado da impressão e camadas
[virtual_sdcard]
path: ~/printer_data/gcodes
on_error_gcode: CANCEL_PRINT

[pause_resume]

[display_status]

[respond]

# Valores que a maquina guarda sozinha (calibracoes, material escolhido, ...)
[save_variables]
filename:/home/blocks/printer_data/config/variables.cfg

[exclude_object]

[idle_timeout] 
timeout: 3600
gcode:
    {% if printer.pause_resume.is_paused %}
        M117 "Print is paused - Idle timeout disabled"
    {% else %}
        M117 Timeout reached
        TURN_OFF_HEATERS
        M84
    {% endif %}

# ----------------------------------------------------------------------------
# Comandos do slicer
# ----------------------------------------------------------------------------

[gcode_macro M106]
gcode:
    {% set p = params.P|default(0)|int %}
    {% set s = params.S|default(255)|float %}
    {% set speed = s / 255 %}

    {% if p == 3 %}
        # COMANDO PARA A CÂMARA (P3 no Orca Slicer)
        SET_FAN_SPEED FAN=Chamber_Fan SPEED={speed}

    {% elif p == 0 %}
        # COMANDO PARA A PEÇA (P0 - Automático por ferramenta)
        {% if printer.toolhead.extruder == "extruder" %}
            {% if printer["fan_generic fan_t0"] is defined %}
                SET_FAN_SPEED FAN=fan_t0 SPEED={speed}
            {% endif %}
        {% elif printer.toolhead.extruder == "extruder1" %}
            {% if printer["fan_generic fan_t1"] is defined %}
                SET_FAN_SPEED FAN=fan_t1 SPEED={speed}
            {% endif %}
        {% endif %}

    {% elif p == 2 %}
        # COMANDO PARA FAN AUXILIAR (P2 no Orca)
        {% if printer["fan_generic fan2"] is defined %}
            SET_FAN_SPEED FAN=fan2 SPEED={speed}
        {% endif %}

    {% else %}
        # Tenta encontrar a fan pelo nome genérico se usares outros P
        {% set fan_name = "fan" + p|string %}
        {% if printer["fan_generic " + fan_name] is defined %}
            SET_FAN_SPEED FAN={fan_name} SPEED={speed}
        {% endif %}
    {% endif %}

[gcode_macro M107]
gcode:
    {% set p = params.P|default(0)|int %}
    M106 P{p} S0

# Maquina sem mesa aquecida: absorve comandos de mesa do slicer sem dar erro
# ("Unknown command: M140/M190"). Se algum dia adicionares [heater_bed],
# remove estas duas macros.
[gcode_macro M140]
gcode:
    {% if printer["heater_bed"] is defined %}
        {% set s = params.S|default(0)|float %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={s}
    {% endif %}

[gcode_macro M190]
gcode:
    {% if printer["heater_bed"] is defined %}
        {% set s = params.S|default(0)|float %}
        SET_HEATER_TEMPERATURE HEATER=heater_bed TARGET={s}
        TEMPERATURE_WAIT SENSOR=heater_bed MINIMUM={s}
    {% endif %}

# ----------------------------------------------------------------------------
# Apoio
# ----------------------------------------------------------------------------

# Faz o home so' se ainda nao estiver feito
[gcode_macro HOME_IF_NEEDED]
gcode:
    {% if "xyz" not in printer.toolhead.homed_axes %}
        G28
    {% endif %}
