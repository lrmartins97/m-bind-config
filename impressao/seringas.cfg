# ============================================================================
# impressao/seringas.cfg
# Preparacao das seringas: escolher a seringa para extrudir a mao, carregar /
# descarregar (empurrador do embolo) e pre-aquecimento antes de imprimir.
# ============================================================================

# ----------------------------------------------------------------------------
# Mexer o embolo de uma seringa a mao (encher, purgar, aliviar a pressao)
# ----------------------------------------------------------------------------
#   SERINGA_T0 / SERINGA_T1            so' escolhe a seringa (MM=0 por omissao)
#   SERINGA_T1 MM=2 SPEED=0.2          avanca 2 mm a 0.2 mm/s
#   SERINGA_T1 MM=-1                   recua 1 mm (MM negativo = retrair), a 0.5 mm/s
#   SERINGA_T1 TEMP=37                 aquece a seringa do T1 a 37 C
#   SERINGA_T1 TEMP=0                  desliga o aquecimento do T1
# TEMP vazio (ou -1) nao mexe no aquecimento. Os limites sao os min_temp e
# max_temp de cada extrusor (hardware/cabeca_t0.cfg e cabeca_t1.cfg).
# Com TEMP e MM no mesmo comando, o embolo so' se mexe quando a seringa
# chegar a temperatura pedida (mais ou menos temp_tolerance). Enquanto
# espera, a maquina nao faz outros comandos; a temperatura vai aparecendo na
# consola. Sem MM, ou com TEMP=0, a temperatura e' so' pedida, sem espera.
# Valores por omissao: MM = 0, SPEED = 0.5, TEMP = -1 (nas linhas "default" das macros
# SERINGA_T0 e SERINGA_T1). Cada parametro fica numa linha propria a comecar
# por "{" e com "|float" no fim: e' assim que o KlipperScreen mostra os campos,
# com o teclado de numeros que tem o sinal "-" e o ponto.
# MM e SPEED sao do embolo (mm e mm/s), nao da pasta. A mensagem na consola
# mostra o equivalente em mm3 e mm3/s.
# A seringa escolhida fica ativa: os botoes de extrudir e retrair do Mainsail
# e do KlipperScreen passam a mexer o embolo dela.
#   - maquina sem home: ativa so' o embolo. Nenhum eixo se mexe e os offsets
#     ficam como estao;
#   - maquina com home: faz a troca de ferramenta normal (T0 / T1) e mexe o
#     embolo onde a cabeca estiver;
#   - durante uma impressao (ou em pausa): recusa.
# Depois de um home fica sempre ativo o embolo da cabeca ativa: o G28 repoe
# o extrusor e os offsets de acordo com o carro ativo.
# As macros T0 e T1 nao sao alteradas por isto.
# ----------------------------------------------------------------------------
[gcode_macro _SERINGA_VARS]
variable_max_mm: 20.0           ; Maximo que o embolo pode andar de cada vez (mm), contra enganos ao escrever
variable_max_speed: 3.0         ; Velocidade maxima do embolo (mm/s)
variable_temp_tolerance: 1.0    ; Com TEMP e MM: o embolo so' se mexe quando a seringa estiver a esta distancia da temperatura pedida (C)
gcode:

[gcode_macro SERINGA_T0]
description: Escolhe a seringa do T0, mexe o embolo e aquece. MM = quanto (negativo retrai, 0 so' escolhe), SPEED = mm/s, TEMP = C (vazio nao mexe, 0 desliga)
gcode:
    {% set mm = params.MM|default(0)|float %}
    {% set speed = params.SPEED|default(0.5)|float %}
    {% set temp = params.TEMP|default(-1)|float %}
    _SERINGA_RUN TOOL=0 MM={mm} SPEED={speed} TEMP={temp}

[gcode_macro SERINGA_T1]
description: Escolhe a seringa do T1, mexe o embolo e aquece. MM = quanto (negativo retrai, 0 so' escolhe), SPEED = mm/s, TEMP = C (vazio nao mexe, 0 desliga)
gcode:
    {% set mm = params.MM|default(0)|float %}
    {% set speed = params.SPEED|default(0.5)|float %}
    {% set temp = params.TEMP|default(-1)|float %}
    _SERINGA_RUN TOOL=1 MM={mm} SPEED={speed} TEMP={temp}

[gcode_macro _SERINGA_RUN]
gcode:
    {% set sv = printer["gcode_macro _SERINGA_VARS"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set mm = params.MM|default(0)|float %}
    {% set speed = params.SPEED|default(0.5)|float %}
    {% set temp = params.TEMP|default(-1)|float %}
    {% if tool != 0 and tool != 1 %}
        {action_raise_error("Indica TOOL=0 ou TOOL=1.")}
    {% endif %}
    {% if printer.print_stats.state in ["printing", "paused"] %}
        {action_raise_error("SERINGA_T%d: nao disponivel durante uma impressao." % tool)}
    {% endif %}
    {% if mm|abs > sv.max_mm|float %}
        {action_raise_error("SERINGA_T%d: MM=%.2f e' demasiado. O maximo de cada vez e' %.1f mm." % (tool, mm, sv.max_mm|float))}
    {% endif %}
    {% if mm != 0 and (speed <= 0 or speed > sv.max_speed|float) %}
        {action_raise_error("SERINGA_T%d: SPEED tem de ser maior do que 0 e no maximo %.1f mm/s." % (tool, sv.max_speed|float))}
    {% endif %}
    {% set ext = "extruder" if tool == 0 else "extruder1" %}
    {% set tmin = printer.configfile.settings[ext].min_temp|float %}
    {% set tmax = printer.configfile.settings[ext].max_temp|float %}
    {% if temp >= 0 and temp != 0 and (temp < tmin or temp > tmax) %}
        {action_raise_error("SERINGA_T%d: TEMP=%.0f fora dos limites do T%d (%.0f a %.0f C)." % (tool, temp, tool, tmin, tmax))}
    {% endif %}
    {% set homed = "x" in printer.toolhead.homed_axes and "y" in printer.toolhead.homed_axes and "z" in printer.toolhead.homed_axes %}

    # --- Temperatura (so' se for pedida) ---
    {% if temp >= 0 %}
        SET_HEATER_TEMPERATURE HEATER={ext} TARGET={'%.1f' % temp}
        {% if temp > 0 %}
            RESPOND PREFIX="info" MSG="T{tool}: aquecimento pedido a {'%.0f' % temp} C (agora {'%.1f' % printer[ext].temperature} C)."
        {% else %}
            RESPOND PREFIX="info" MSG="T{tool}: aquecimento desligado."
        {% endif %}
    {% endif %}

    # --- Escolher a seringa ---
    {% if homed %}
        T{tool}
    {% elif printer.toolhead.extruder != ext %}
        ACTIVATE_EXTRUDER EXTRUDER={ext}
    {% endif %}
    {% set como = "troca de ferramenta normal" if homed else "so' o embolo foi ativado, as cabecas nao se mexeram (maquina sem home)" %}

    # --- Mexer o embolo (com TEMP: so' depois de chegar a temperatura) ---
    {% if mm != 0 and temp > 0 %}
        {% set tol = sv.temp_tolerance|float %}
        RESPOND PREFIX="info" MSG="T{tool}: a espera de {'%.0f' % temp} C para mexer o embolo (agora {'%.1f' % printer[ext].temperature} C)..."
        TEMPERATURE_WAIT SENSOR={ext} MINIMUM={'%.2f' % (temp - tol)} MAXIMUM={'%.2f' % (temp + tol)}
        RESPOND PREFIX="info" MSG="T{tool}: temperatura atingida."
    {% endif %}
    {% if mm != 0 %}
        {% set area = 3.14159265 * (printer.configfile.settings[ext].filament_diameter|float / 2) ** 2 %}
        SAVE_GCODE_STATE NAME=_seringa_run
        M83
        G1 E{'%.4f' % mm} F{'%.2f' % (speed * 60)}
        RESTORE_GCODE_STATE NAME=_seringa_run MOVE=0
        RESPOND PREFIX="info" MSG="T{tool}: embolo {'avanca' if mm > 0 else 'recua'} {'%.2f' % (mm|abs)} mm a {'%.2f' % speed} mm/s ({'%.0f' % (mm|abs * area)} mm3 a {'%.0f' % (speed * area)} mm3/s). Seringa escolhida: {como}."
    {% else %}
        RESPOND PREFIX="info" MSG="Seringa do T{tool} escolhida: {como}."
    {% endif %}

# Load / unload do empurrador do embolo (preparado; sem botao para ja).
# As distancias e velocidades estao em _CLEAN_VARS (limpeza.cfg).
[gcode_macro _SYRINGE_MOVE]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|default(-1)|int %}
    {% set what = params.MODE|default("load")|lower %}
    {% if tool != 0 and tool != 1 %}
        {action_raise_error("Indica TOOL=0 ou TOOL=1.")}
    {% endif %}
    {% set dist = cv["t" ~ tool ~ "_" ~ what ~ "_distance"] %}
    HOME_IF_NEEDED
    T{tool}
    SAVE_GCODE_STATE NAME=_syringe_move
    M83
    G1 E{dist} F{cv.load_speed * 60}
    M400
    RESTORE_GCODE_STATE NAME=_syringe_move MOVE=0
    RESPOND PREFIX="info" MSG="T{tool}: empurrador movido {dist} mm ({what})."

[gcode_macro _SYRINGE_LOAD]
gcode:
    _SYRINGE_MOVE TOOL={params.TOOL|default(-1)} MODE=load

[gcode_macro _SYRINGE_UNLOAD]
gcode:
    _SYRINGE_MOVE TOOL={params.TOOL|default(-1)} MODE=unload

; ============================================================
;  PREHEAT — IMPRESSORA MÉDICA IDEX (sem cama)
;  Extrusores: extruder  (T0)  |  extruder1 (T1)
;  Range: 10°C – 80°C
; ============================================================
[gcode_macro PREHEAT]
description: Preheat de um extrusor de pasta — escolhe T0 ou T1
variable_active: False
variable_toolhead: "T0"
variable_target_temp: 0
variable_duration: 0
gcode:
  {% set T       = params.T|default("T0")|string %}
  {% set TEMP    = params.TEMP|default(0)|int %}
  {% set MINUTES = params.MINUTES|default(10)|int %}

  {% if TEMP == 0 %}
    { action_respond_info("Uso: PREHEAT T=T0 TEMP=37 MINUTES=10") }
    { action_respond_info("     PREHEAT T=T1 TEMP=25 MINUTES=10") }
  {% elif TEMP < 10 or TEMP > 80 %}
    { action_respond_info("ERRO: Temperatura fora do range permitido (10-80 graus C)") }
  {% else %}
    SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=active       VALUE=True
    SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=toolhead     VALUE='"{T}"'
    SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=target_temp  VALUE={TEMP}
    SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=duration     VALUE={MINUTES}

    {% if T == "T1" %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET={TEMP}
      { action_respond_info("Preheat T1 (extruder1): %d C durante %d min" % (TEMP, MINUTES)) }
    {% else %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET={TEMP}
      { action_respond_info("Preheat T0 (extruder): %d C durante %d min" % (TEMP, MINUTES)) }
    {% endif %}

    UPDATE_DELAYED_GCODE ID=PREHEAT_TIMEOUT DURATION={MINUTES * 60}
  {% endif %}

; --- Perfis pré-definidos -----------------------------------
[gcode_macro PREHEAT_PLURONIC]
description: Pluronic F-127 — gelificacao a 37 C
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(10)|int %}
  PREHEAT T={T} TEMP=37 MINUTES={M}

[gcode_macro PREHEAT_ALGINATO]
description: Alginato de sodio — temperatura ambiente
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(10)|int %}
  PREHEAT T={T} TEMP=25 MINUTES={M}

[gcode_macro PREHEAT_GELMA]
description: GelMA — pre-aquecimento moderado
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(15)|int %}
  PREHEAT T={T} TEMP=37 MINUTES={M}

[gcode_macro PREHEAT_HIDROXIAPATITE]
description: Pasta de hidroxiapatite (HA) — pasta ceramica
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(15)|int %}
  PREHEAT T={T} TEMP=60 MINUTES={M}

[gcode_macro PREHEAT_TCP]
description: Fosfato tricalcico (TCP) — pasta ceramica
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(15)|int %}
  PREHEAT T={T} TEMP=60 MINUTES={M}

[gcode_macro PREHEAT_SILICONE]
description: Silicone medico — extrusao aquecida
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(10)|int %}
  PREHEAT T={T} TEMP=45 MINUTES={M}

[gcode_macro PREHEAT_COLAGENO]
description: Colageno — temperatura fisiologica
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(10)|int %}
  PREHEAT T={T} TEMP=37 MINUTES={M}

[gcode_macro PREHEAT_FIBRINA]
description: Fibrina/fibrinogenio — temperatura fisiologica
gcode:
  {% set T = params.T|default("T0")|string %}
  {% set M = params.MINUTES|default(10)|int %}
  PREHEAT T={T} TEMP=37 MINUTES={M}

; --- Cancelar -----------------------------------------------
[gcode_macro CANCEL_PREHEAT]
description: Cancela preheat e desliga aquecimento do extrusor ativo
gcode:
  {% set estado = printer["gcode_macro PREHEAT"] %}
  UPDATE_DELAYED_GCODE ID=PREHEAT_TIMEOUT DURATION=0
  SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=active VALUE=False

  {% if estado.toolhead == "T1" %}
    SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    { action_respond_info("Preheat cancelado — T1 desligado.") }
  {% else %}
    SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    { action_respond_info("Preheat cancelado — T0 desligado.") }
  {% endif %}

[gcode_macro CANCEL_PREHEAT_ALL]
description: Desliga aquecimento dos dois extrusores
gcode:
  UPDATE_DELAYED_GCODE ID=PREHEAT_TIMEOUT DURATION=0
  SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=active VALUE=False
  SET_HEATER_TEMPERATURE HEATER=extruder  TARGET=0
  SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
  { action_respond_info("Todos os extrusores desligados.") }

; --- Timeout automático -------------------------------------
[delayed_gcode PREHEAT_TIMEOUT]
gcode:
  {% if printer["gcode_macro PREHEAT"].active %}
    {% set th = printer["gcode_macro PREHEAT"].toolhead %}
    SET_GCODE_VARIABLE MACRO=PREHEAT VARIABLE=active VALUE=False
    {% if th == "T1" %}
      SET_HEATER_TEMPERATURE HEATER=extruder1 TARGET=0
    {% else %}
      SET_HEATER_TEMPERATURE HEATER=extruder TARGET=0
    {% endif %}
    { action_respond_info("Preheat terminado automaticamente. Extrusor desligado.") }
  {% endif %}
