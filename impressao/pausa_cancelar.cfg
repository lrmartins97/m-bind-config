# ============================================================================
# impressao/pausa_cancelar.cfg
# Pausar, retomar e cancelar uma impressao (botoes do Mainsail e do
# KlipperScreen), e a pausa numa camada escolhida.
# ============================================================================

# Monitorização de camadas (necessário para o Mainsail conseguir pausar a uma altura/camada específica se pedires na interface)
[gcode_macro SET_PAUSE_NEXT_LAYER]
description: Enable a pause if the next layer is reached
gcode:
  {% set pause_next_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_next_layer %}
  {% set ENABLE = params.ENABLE|default(1)|int != 0 %}
  {% set MACRO = params.MACRO|default(pause_next_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_next_layer VALUE="{{ 'enable': ENABLE, 'call': MACRO }}"

[gcode_macro SET_PAUSE_AT_LAYER]
description: Enable/disable a pause if a given layer number is reached
gcode:
  {% set pause_at_layer = printer['gcode_macro SET_PRINT_STATS_INFO'].pause_at_layer %}
  {% set ENABLE = params.ENABLE|int != 0 if params.ENABLE is defined
             else params.LAYER is defined %}
  {% set LAYER = params.LAYER|default(pause_at_layer.layer)|int %}
  {% set MACRO = params.MACRO|default(pause_at_layer.call, True) %}
  SET_GCODE_VARIABLE MACRO=SET_PRINT_STATS_INFO VARIABLE=pause_at_layer VALUE="{{ 'enable': ENABLE, 'layer': LAYER, 'call': MACRO }}"

[gcode_macro SET_PRINT_STATS_INFO]
rename_existing: SET_PRINT_STATS_INFO_BASE
description: Overwrite, to get pause_next_layer and pause_at_layer feature
variable_pause_next_layer: { 'enable': False, 'call': "PAUSE" }
variable_pause_at_layer  : { 'enable': False, 'layer': 0, 'call': "PAUSE" }
gcode:
  {% if pause_next_layer.enable %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_next_layer" % pause_next_layer.call}'
    {pause_next_layer.call}
    SET_PAUSE_NEXT_LAYER ENABLE=0
  {% elif pause_at_layer.enable and params.CURRENT_LAYER is defined and params.CURRENT_LAYER|int == pause_at_layer.layer %}
    RESPOND TYPE=echo MSG='{"%s, forced by pause_at_layer [%d]" % (pause_at_layer.call, pause_at_layer.layer)}'
    {pause_at_layer.call}
    SET_PAUSE_AT_LAYER ENABLE=0
  {% endif %}
  SET_PRINT_STATS_INFO_BASE {rawparams}

# Variáveis globais para retração, velocidades de pausa e retoma
[gcode_macro _GLOBAL_PRINT_VARS]
variable_park_xy_speed: 100      ; Velocidade de deslocação para o parque (mm/s)
variable_z_hop_distance: 2.0     ; Altura do Z-hop ao pausar (mm)
variable_z_hop_speed: 10         ; Velocidade do Z-hop ao pausar (mm/s)
variable_return_xy_speed: 100    ; Velocidade de regresso a X/Y (mm/s)
variable_return_z_speed: 10      ; Velocidade de descida em Z ao retomar (mm/s)
variable_retract_distance: 0.1   ; Distância de retração na pausa (mm)
variable_retract_speed: 5        ; Velocidade de retração (mm/s)
gcode:

# Variáveis auxiliares para guardar o estado exato da pausa
[gcode_macro _PAUSE_STATE]
variable_saved_x: 0.0
variable_saved_y: 0.0
variable_saved_z: 0.0
variable_saved_tool: 0          ; ferramenta ativa no momento da pausa (0 ou 1)
variable_paused_mark: 0.0       ; tempo parado acumulado no inicio da pausa (s): para saber quanto durou
gcode:

[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    BASE_PAUSE
    
    {% set uv = printer["gcode_macro _GLOBAL_PRINT_VARS"] %}
    
    # Posicao em coordenadas G-code (as mesmas que o G1 do RESUME usa). A
    # posicao fisica (toolhead.position) inclui os offsets da ferramenta: com
    # o T1 ativo, o regresso ia primeiro a um ponto desviado do offset do T1
    # (so depois o BASE_RESUME corrigia).
    {% set current_x = printer.gcode_move.gcode_position.x %}
    {% set current_y = printer.gcode_move.gcode_position.y %}
    {% set current_z = printer.gcode_move.gcode_position.z %}
    {% set current_tool = 1 if printer.dual_carriage["carriage_1"] == "PRIMARY" else 0 %}
    
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=saved_x VALUE={current_x}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=saved_y VALUE={current_y}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=saved_z VALUE={current_z}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=saved_tool VALUE={current_tool}
    SET_GCODE_VARIABLE MACRO=_PAUSE_STATE VARIABLE=paused_mark VALUE={printer.print_stats.total_duration - printer.print_stats.print_duration}
    
    SAVE_GCODE_STATE NAME=pause_state
    
    G91
    G1 E-{uv.retract_distance} F{uv.retract_speed * 60}
    
    {% if current_z + uv.z_hop_distance <= printer.toolhead.axis_maximum.z %}
        G1 Z{uv.z_hop_distance} F{uv.z_hop_speed * 60}
    {% endif %}
    G90

    {% if printer.toolhead.extruder == "extruder1" or printer.dual_carriage["carriage_1"] == "PRIMARY" %}
        {action_respond_info("A estacionar T1...")}
        PARK_extruder1
    {% else %}
        {action_respond_info("A estacionar T0...")}
        PARK_extruder
    {% endif %}

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set uv = printer["gcode_macro _GLOBAL_PRINT_VARS"] %}
    {% set sv = printer["gcode_macro _PAUSE_STATE"] %}
    {% set tool = sv.saved_tool|int %}

    # Se a ferramenta foi trocada durante a pausa, volta a da impressao antes
    # de tudo: o estado guardado (offsets) pertence a essa ferramenta.
    {% set active_tool = 1 if printer.dual_carriage["carriage_1"] == "PRIMARY" else 0 %}
    {% if active_tool != tool %}
        {action_respond_info("A repor a ferramenta T%d da impressao..." % tool)}
        T{tool}
    {% endif %}

    # Purga e limpeza antes de retomar (limpeza.cfg: clean_on_resume), se a
    # pausa durou pelo menos resume_clean_min_pause e a ferramenta tem
    # estacoes. A purga volta a por pasta na ponta (substitui a reposicao da
    # pequena retracao da pausa); a reposicao da retracao da limpeza so' e'
    # feita ja na posicao de impressao.
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set p = "t" ~ tool ~ "_" %}
    {% set paused_s = printer.print_stats.total_duration - printer.print_stats.print_duration - sv.paused_mark|float %}
    {% set zones = cv[p ~ "purge_enable"]|int == 1 or cv[p ~ "brush_enable"]|int == 1 or cv[p ~ "wiper_enable"]|int == 1 %}
    {% set clean = cv.clean_on_resume|default(0)|int == 1 and zones and paused_s >= cv.resume_clean_min_pause|default(30)|float %}
    {% if clean %}
        {action_respond_info("Pausa de %d s: a limpar o T%d antes de retomar..." % (paused_s|int, tool))}
        CLEAN_NOZZLE TOOL={tool} RETURN=0 RESUME=1
    {% endif %}

    {action_respond_info("A retornar à posição de impressão...")}
    G90
    G1 X{sv.saved_x} Y{sv.saved_y} F{uv.return_xy_speed * 60}
    G1 Z{sv.saved_z} F{uv.return_z_speed * 60}

    # Reposicao junto da peca, imediatamente antes de continuar
    {% if clean %}
        _CLEAN_UNRETRACT TOOL={tool}
    {% else %}
        G91
        G1 E{uv.retract_distance} F{uv.retract_speed * 60}
        G90
    {% endif %}

    RESTORE_GCODE_STATE NAME=pause_state MOVE=0

    BASE_RESUME

[gcode_macro CANCEL_PRINT]
rename_existing: BASE_CANCEL_PRINT
gcode:
    BASE_CANCEL_PRINT
    
    # Recolhe imediatamente a ferramenta ativa para o seu parque respetivo
    {% if printer.toolhead.extruder == "extruder1" or printer.dual_carriage["carriage_1"] == "PRIMARY" %}
        PARK_extruder1
    {% else %}
        PARK_extruder
    {% endif %}
    
    CLEAR_PAUSE
    SDCARD_RESET_FILE

    # Desliga o aquecimento das duas ferramentas (e da mesa, se existir)
    TURN_OFF_HEATERS

    # Desliga as ventoinhas, como no PRINT_END
    M107
    {% if printer["fan_generic Chamber_Fan"] is defined %}
        SET_FAN_SPEED FAN=Chamber_Fan SPEED=0
    {% endif %}
    {% if printer["fan_generic fan_t0"] is defined %}
        SET_FAN_SPEED FAN=fan_t0 SPEED=0
    {% endif %}
    {% if printer["fan_generic fan_t1"] is defined %}
        SET_FAN_SPEED FAN=fan_t1 SPEED=0
    {% endif %}
    {% if printer["fan_generic fan2"] is defined %}
        SET_FAN_SPEED FAN=fan2 SPEED=0
    {% endif %}

    # Se o cancelamento apanhar a calibracao do arranque a meio: apaga o anel
    # de LEDs da camara de calibracao e volta a ligar as camaras das cabecas
    _CALIB_VISION_OFF

    {action_respond_info("Impressão cancelada: ferramenta estacionada, aquecimento e ventoinhas desligados.")}
