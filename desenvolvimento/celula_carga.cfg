# ============================================================================
# desenvolvimento/celula_carga.cfg
# Celula de carga do prato (HX711). DESLIGADA: para desenvolvimento futuro.
# Para ligar: tirar o "#" do include no printer.cfg.
# ============================================================================

[load_cell bed]
sensor_type = hx711
sclk_pin = TFT_RX
dout_pin = TFT_TX
gain = A-128
sample_rate =10


[gcode_macro DIAG_LOAD_CELL]
gcode:
    { action_respond_info("Dados: " ~ printer['load_cell bed'] | string) }

[gcode_macro MOSTRAR_PESO]
gcode:
    {% set peso = printer['load_cell bed'].force_g | float %}
    { action_respond_info("Peso atual: %.2f g" % peso) }


[gcode_macro DIAG_LOAD_CELL]
gcode:
    { action_respond_info("Dados: " ~ printer['load_cell bed'] | string) }
