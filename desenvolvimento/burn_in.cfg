# ============================================================================
# desenvolvimento/burn_in.cfg
# Teste de rodagem (burn-in) de 24 horas.
# ============================================================================

[gcode_macro BURN_IN]
description: Burn-in 24h a Z=5mm no prato 100x100 — varrimento bidirecional
variable__start_time: 0
gcode:
    M117 Burn-in a iniciar...
    G90
    M83
    G28
    G1 Z5 F600
    G1 X5 Y5 F3000
    M117 Burn-in a decorrer...
    SET_GCODE_VARIABLE MACRO=BURN_IN VARIABLE=_start_time VALUE={printer.system_stats.cputime}
    UPDATE_DELAYED_GCODE ID=_BURN_IN_TICK DURATION=0.1

[delayed_gcode _BURN_IN_TICK]
gcode:
    {% set start   = printer["gcode_macro BURN_IN"]._start_time %}
    {% set elapsed = printer.system_stats.cputime - start %}

    {% if elapsed < 86400 %}

        ; === IDA: Y5 → Y95 ===
        G1 X5  Y5  Z5 F3000
        G1 X95 Y5  Z5 F3000
        G1 X95 Y15 Z5 F3000
        G1 X5  Y15 Z5 F3000
        G1 X5  Y25 Z5 F3000
        G1 X95 Y25 Z5 F3000
        G1 X95 Y35 Z5 F3000
        G1 X5  Y35 Z5 F3000
        G1 X5  Y45 Z5 F3000
        G1 X95 Y45 Z5 F3000
        G1 X95 Y55 Z5 F3000
        G1 X5  Y55 Z5 F3000
        G1 X5  Y65 Z5 F3000
        G1 X95 Y65 Z5 F3000
        G1 X95 Y75 Z5 F3000
        G1 X5  Y75 Z5 F3000
        G1 X5  Y85 Z5 F3000
        G1 X95 Y85 Z5 F3000
        G1 X95 Y95 Z5 F3000
        G1 X5  Y95 Z5 F3000

        ; === VOLTA: Y95 → Y5 ===
        G1 X5  Y95 Z5 F3000
        G1 X95 Y95 Z5 F3000
        G1 X95 Y85 Z5 F3000
        G1 X5  Y85 Z5 F3000
        G1 X5  Y75 Z5 F3000
        G1 X95 Y75 Z5 F3000
        G1 X95 Y65 Z5 F3000
        G1 X5  Y65 Z5 F3000
        G1 X5  Y55 Z5 F3000
        G1 X95 Y55 Z5 F3000
        G1 X95 Y45 Z5 F3000
        G1 X5  Y45 Z5 F3000
        G1 X5  Y35 Z5 F3000
        G1 X95 Y35 Z5 F3000
        G1 X95 Y25 Z5 F3000
        G1 X5  Y25 Z5 F3000
        G1 X5  Y15 Z5 F3000
        G1 X95 Y15 Z5 F3000
        G1 X95 Y5  Z5 F3000
        G1 X5  Y5  Z5 F3000

        UPDATE_DELAYED_GCODE ID=_BURN_IN_TICK DURATION=0.1

    {% else %}
        ; Fim das 24 horas
        M117 Burn-in concluido!
        G1 Z25 F600
        G1 X50 Y50 F3000
        M84
        M117 Concluido — 24h OK
    {% endif %}
