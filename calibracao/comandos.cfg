# ============================================================================
# calibracao/comandos.cfg
# CALIBRACAO ENTRE FERRAMENTAS - comandos para o utilizador
#   CALIBRATE_IDEX      tudo (Z e X/Y). Z_MANUAL=1: Z pelo papel.
#                       XY_MANUAL=1: X/Y pela mira. Sem parametros: automatico.
#                       RECALIBRAR_CAMARA=1: volta a calibrar a camara (X/Y automatico).
#   Em todos: LIMPEZA=0 nao limpa os bicos (por defeito limpa cada ferramenta
#   imediatamente antes de cada medicao, ver limpeza.cfg).
# A calibracao da camara (mm/pixel) so' e' refeita quando e' preciso: nao
# existe (servidor sem a tabela gravada, ou Klipper sem o valor mm/pixel), o
# foco mudou desde a ultima (CALIBRATE_IDEX_CAMERA_FOCUS), ou e' pedida.
#   CALIBRATE_IDEX_XY   so' o X/Y (exige o Z calibrado). MANUAL=1: pela mira.
#                       RECALIBRAR_CAMARA=1: volta a calibrar a camara (automatico).
#   CALIBRATE_IDEX_Z    so' o Z. MANUAL=1: pelo papel. Depois disto o X/Y tem de
#                       ser refeito (o Z novo passa o X/Y a provisorio).
#   CALIBRATE_IDEX_STATUS   offsets, estado e datas da calibracao.
# Ordem da calibracao completa:
#   Z pelo switch: X/Y provisorio -> Z -> X/Y final (o switch precisa do X/Y
#                  para os dois bicos lhe tocarem no mesmo ponto)
#   Z pelo papel:  Z -> X/Y final (o papel nao precisa do X/Y)
# Cada medicao esta no seu ficheiro: z_t1.cfg, xy_manual.cfg, xy_camara.cfg.
# ============================================================================
[gcode_macro _IDEX_CAL_VARS]
variable_xy_manual: 0           ; interno: modo do X/Y a seguir ao Z pelo papel
variable_recal: 0               ; interno: RECALIBRAR_CAMARA pedido na calibracao completa com Z pelo papel
gcode:

[gcode_macro CALIBRATE_IDEX]
description: Calibracao completa entre ferramentas (Z e X/Y). Z_MANUAL=1 mede o Z pelo papel, XY_MANUAL=1 mede o X/Y pela mira, RECALIBRAR_CAMARA=1 volta a calibrar a camara, LIMPEZA=0 nao limpa os bicos. Sem parametros: tudo automatico, com limpeza
gcode:
    {% set zm = params.Z_MANUAL|default(0)|int %}
    {% set xym = params.XY_MANUAL|default(0)|int %}
    {% if zm not in [0, 1] or xym not in [0, 1] %}
        {action_raise_error("CALIBRATE_IDEX: Z_MANUAL e XY_MANUAL so' aceitam 0 (automatico) ou 1 (manual).")}
    {% endif %}
    _IDEX_CAL_BEGIN LIMPEZA={params.LIMPEZA|default(1)|int}
    {% set recal = params.RECALIBRAR_CAMARA|default(0)|int %}
    {% if zm == 0 and xym == 0 %}
        _IDEX_CAL_ALL_AUTO RECALIBRAR_CAMARA={recal}
    {% elif zm == 0 %}
        _IDEX_CAL_ALL_MANUAL
    {% else %}
        _IDEX_CAL_ALL_PAPER XY_MANUAL={xym} RECALIBRAR_CAMARA={recal}
    {% endif %}

[gcode_macro CALIBRATE_IDEX_XY]
description: So' a posicao entre bicos (X/Y). Exige o Z calibrado. MANUAL=1 pela mira. RECALIBRAR_CAMARA=1 volta a calibrar a camara (automatico). LIMPEZA=0 nao limpa os bicos
gcode:
    {% set m = params.MANUAL|default(0)|int %}
    {% if m not in [0, 1] %}
        {action_raise_error("CALIBRATE_IDEX_XY: MANUAL so' aceita 0 (automatico) ou 1 (manual).")}
    {% endif %}
    _IDEX_CAL_BEGIN LIMPEZA={params.LIMPEZA|default(1)|int}
    {% if m == 1 %}
        _IDEX_CAL_XY_MANUAL
    {% else %}
        _IDEX_CAL_XY_AUTO RECALIBRAR_CAMARA={params.RECALIBRAR_CAMARA|default(0)|int}
    {% endif %}

[gcode_macro CALIBRATE_IDEX_Z]
description: So' a altura entre bicos (Z). MANUAL=1 pelo papel. LIMPEZA=0 nao limpa os bicos. Depois disto, refaz o X/Y
gcode:
    {% set m = params.MANUAL|default(0)|int %}
    {% if m not in [0, 1] %}
        {action_raise_error("CALIBRATE_IDEX_Z: MANUAL so' aceita 0 (automatico) ou 1 (manual).")}
    {% endif %}
    _IDEX_CAL_BEGIN LIMPEZA={params.LIMPEZA|default(1)|int}
    {% if m == 1 %}
        _IDEX_CAL_Z_MANUAL
    {% else %}
        _IDEX_CAL_Z_AUTO
    {% endif %}

[gcode_macro CALIBRATE_IDEX_STATUS]
description: Mostra os offsets entre ferramentas, o estado e as datas de calibracao
gcode:
    IDEX_CALIBRATION_STATUS

# ----------------------------------------------------------------------------
# Calibracao completa (Z e X/Y), passo a passo
# ----------------------------------------------------------------------------

# Tudo automatico: X/Y provisorio (camara) -> Z (switch) -> X/Y final (camara)
[gcode_macro _IDEX_CAL_ALL_AUTO]
description: Calibracao completa entre ferramentas - X/Y (camara), Z (switch), X/Y final (camara)
gcode:
    RESPOND PREFIX="info" MSG="Calibracao completa entre ferramentas: 3 passos."
    HOME_IF_NEEDED
    _CALIB_VISION_ON
    RESPOND PREFIX="info" MSG="Passo 1/3 (X/Y provisorio): camara."
    _IDEX_XY_AUTO STATE=PROVISIONAL FORCE_RECAL={params.RECALIBRAR_CAMARA|default(0)|int}
    RESPOND PREFIX="info" MSG="Passo 2/3 (Z): medicao automatica no switch."
    CALIBRATE_IDEX_Z_OFFSET REQUIRE_SAVE=1 CLEAN=1
    RESPOND PREFIX="info" MSG="Passo 3/3 (X/Y final): camara."
    _IDEX_XY_AUTO STATE=FINAL FORCE_RECAL=0
    _CALIB_VISION_OFF
    RESPOND PREFIX="info" MSG="Calibracao completa entre ferramentas concluida."
    IDEX_CALIBRATION_STATUS

# Calibracao completa com o Z pelo papel: Z (papel, T0 e T1) -> X/Y final.
# O papel e' interativo: o X/Y arranca sozinho depois do ACCEPT do T1.
[gcode_macro _IDEX_CAL_ALL_PAPER]
gcode:
    SET_GCODE_VARIABLE MACRO=_IDEX_CAL_VARS VARIABLE=xy_manual VALUE={params.XY_MANUAL|default(0)|int}
    SET_GCODE_VARIABLE MACRO=_IDEX_CAL_VARS VARIABLE=recal VALUE={params.RECALIBRAR_CAMARA|default(0)|int}
    RESPOND PREFIX="info" MSG="Calibracao completa entre ferramentas: 2 passos. Passo 1/2 (Z): papel, T0 e depois T1."
    HOME_IF_NEEDED
    CALIBRATE_IDEX_Z_PAPER CLEAN=1 THEN=_IDEX_CAL_AFTER_PAPER

# Chamada pelo modulo depois de o Z pelo papel ficar gravado
[gcode_macro _IDEX_CAL_AFTER_PAPER]
gcode:
    {% set xym = printer["gcode_macro _IDEX_CAL_VARS"].xy_manual|int %}
    _CALIB_VISION_ON
    {% if xym == 1 %}
        _ALIGN_START MODE=3
    {% else %}
        RESPOND PREFIX="info" MSG="Passo 2/2 (X/Y final): camara."
        _IDEX_XY_AUTO STATE=FINAL FORCE_RECAL={printer["gcode_macro _IDEX_CAL_VARS"].recal|int}
        _CALIB_VISION_OFF
        RESPOND PREFIX="info" MSG="Calibracao completa entre ferramentas concluida."
        IDEX_CALIBRATION_STATUS
    {% endif %}

# ---------------------------------------------------------------------------
# Limpeza nas calibracoes: cada ferramenta e' limpa imediatamente antes de ser
# medida, para as duas pontas serem medidas no mesmo estado (acabadas de
# limpar). Na 1a limpeza de cada ferramenta numa calibracao ha purga
# (purge_before_calibration); nas seguintes (ex.: X/Y final depois do Z) so
# escova e wiper. Nunca repoe a retracao (a ponta fica sem pressao e nao pinga
# durante a medicao); a purga seguinte compensa-a.
# ---------------------------------------------------------------------------

# Inicio de uma calibracao: esquece as limpezas da calibracao anterior e
# regista se esta calibracao limpa (LIMPEZA=1, por defeito) ou nao (LIMPEZA=0)
[gcode_macro _IDEX_CAL_BEGIN]
gcode:
    {% set lim = params.LIMPEZA|default(1)|int %}
    {% if lim not in [0, 1] %}
        {action_raise_error("LIMPEZA so' aceita 1 (com limpeza) ou 0 (sem limpeza).")}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calib_cleaned_t0 VALUE=0
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calib_cleaned_t1 VALUE=0
    SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calib_clean VALUE={lim}
    # A calibracao comeca sem babystep (como o PRINT_START): um babystep de
    # uma impressao que nao foi guardado e' descartado, e o offset da
    # ferramenta ativa fica como esta. As medicoes nao dependem dele, mas
    # assim nao fica um offset "herdado" durante e depois da calibracao.
    {% set baby = printer.gcode_move.homing_origin.z - printer["gcode_macro _TOOLZ"].applied|float %}
    {% if baby|abs > 0.0005 %}
        SET_GCODE_OFFSET Z=0
        RESPOND PREFIX="info" MSG="Babystep de {'%+.3f' % baby} mm descartado no inicio da calibracao (nao estava guardado). Para o guardar da proxima vez: Z_OFFSET_APPLY_ENDSTOP (as duas ferramentas) ou IDEX_Z_TRIM_T1 GUARDAR_BABYSTEP=1 (so o T1), antes de calibrar."
    {% endif %}
    {% if lim == 0 %}
        RESPOND PREFIX="info" MSG="Calibracao sem limpeza dos bicos (LIMPEZA=0)."
    {% endif %}

# Limpa uma ferramenta antes de a medir (fica ativa no fim)
[gcode_macro _IDEX_CAL_CLEAN_TOOL]
gcode:
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set tool = params.TOOL|int %}
    {% if cv.clean_before_calibration|int == 1 and cv.calib_clean|default(1)|int == 1 %}
        {% set first = cv["calib_cleaned_t" ~ tool]|int == 0 %}
        {% if first or cv.clean_each_measurement|int == 1 %}
            CLEAN_NOZZLE TOOL={tool} PURGE={cv.purge_before_calibration|int if first else 0} RETURN=0 UNRETRACT=0
        {% endif %}
        SET_GCODE_VARIABLE MACRO=_CLEAN_VARS VARIABLE=calib_cleaned_t{tool} VALUE=1
    {% endif %}
