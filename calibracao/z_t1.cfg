# ============================================================================
# calibracao/z_t1.cfg
# Altura (Z) do T1 em relacao ao T0: medicao pelo switch ou pelo papel
# (modulo idex_z_offset.py) e ajuste fino do T1 (IDEX_Z_TRIM_T1).
# ============================================================================

# Carrega o modulo extras/idex_z_offset.py e define os parametros.
# O nome da seccao TEM de ser igual ao nome do ficheiro .py.
#
# Comandos disponibilizados pelo modulo:
#   CALIBRATE_IDEX_Z_OFFSET     -> switch (automatico) + sanidade
#   MEASURE_ACTIVE_NOZZLE_Z     -> so mede o bico ativo (diagnostico)
#   CALIBRATE_IDEX_Z_PAPER      -> papel, passo 1/2 (T0)
#   CALIBRATE_IDEX_Z_PAPER_T1   -> papel, passo 2/2 (T1)
#   IDEX_SAVE_XY_OFFSET         -> grava o offset X/Y (usado pelas macros X/Y)
#   IDEX_CHECK_XY_ALLOWED       -> barreira das calibracoes X/Y isoladas
#   IDEX_CALIBRATION_STATUS     -> offsets, estado e datas da calibracao
#   PRINTCORE_CHANGED TOOL=n    -> invalida a calibracao (futuro sensor)
#
# Comandos para o utilizador:
#   CALIBRATE_IDEX / CALIBRATE_IDEX XY_MANUAL=1 -> calibracao completa
#   CALIBRATE_IDEX_Z / CALIBRATE_IDEX_Z MANUAL=1 -> so a altura (Z)
#   CALIBRATE_IDEX_XY / CALIBRATE_IDEX_XY MANUAL=1 -> so a posicao (X/Y)
#   CALIBRATE_IDEX_STATUS -> estado da calibracao
[idex_z_offset]
switch_position: 83, 113      # X,Y onde o bico toca no switch (= safe_z_home)
probe_speed: 2                # velocidade da sondagem (mm/s) - lento!
lift_speed: 6                 # velocidade de subida/recolha (mm/s)
samples: 5                    # nº de leituras por bico (mediana)
sample_retract_dist: 2        # recolha entre leituras (mm)
probe_z_min: -2               # piso de seguranca da sondagem (mm)
safe_z: 10                    # altura de deslocacao entre pontos (mm)

# --- Sanidade (metodo switch) ---
# 1 = debug: reporta tudo (inclui o que os niveis 2/3 fariam) mas GRAVA SEMPRE
# 2 = equilibrado: se a dispersao passar o limite, NAO grava, mantem o antigo
# 3 = estrito: se passar, BLOQUEIA e encaminha para o papel
sanity_level: 1
sanity_dispersion_max: 0.05   # dispersao maxima aceitavel entre amostras (mm)

# --- Metodo do papel (recurso manual) ---
paper_bed_x: 50               # X do ponto de teste do papel (centro do prato)
paper_bed_y: 70               # Y do ponto de teste do papel

# Nomes das variaveis em variables.cfg (so mudar se usares outros):
x_offset_var: tool_1_x_offset
y_offset_var: tool_1_y_offset
z_offset_var: tool_1_z_offset

# Passos chamados por CALIBRATE_IDEX_Z (comandos.cfg). MEASURE_ACTIVE_NOZZLE_Z
# continua disponivel na consola para diagnostico.
[gcode_macro _IDEX_CAL_Z_AUTO]
description: Altura entre bicos - automatico (switch), com verificacao de consistencia
gcode:
    HOME_IF_NEEDED
    CALIBRATE_IDEX_Z_OFFSET CLEAN=1

[gcode_macro _IDEX_CAL_Z_MANUAL]
description: Altura entre bicos - manual (papel), T0 e depois T1
gcode:
    HOME_IF_NEEDED
    CALIBRATE_IDEX_Z_PAPER CLEAN=1

# ----------------------------------------------------------------------------
# Ajuste fino da altura do T1
# ----------------------------------------------------------------------------
# Se, depois de calibrado, o T1 imprime sempre um pouco mais alto ou mais
# baixo do que o T0, esse desvio fica aqui (tool_1_z_trim, variables.cfg). Soma
# se ao offset Z medido (switch ou papel) e sobrevive as calibracoes, que medem
# sempre o offset "puro". Positivo = T1 mais alto (como o babystep).
#   IDEX_Z_TRIM_T1                      mostra o valor atual
#   IDEX_Z_TRIM_T1 VALUE=0.05           define o ajuste (mm)
#   IDEX_Z_TRIM_T1 ADJUST=-0.01         soma ao ajuste atual (mm)
#   IDEX_Z_TRIM_T1 GUARDAR_BABYSTEP=1   com o T1 ativo: passa o babystep atual
#                                       para o ajuste (o bico nao se mexe)
# ----------------------------------------------------------------------------
[gcode_macro IDEX_Z_TRIM_T1]
description: Ajuste fino da altura do T1 (soma-se ao offset Z calibrado). VALUE=mm, ADJUST=mm, GUARDAR_BABYSTEP=1 (T1 ativo). Sem parametros mostra
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set old = svv.tool_1_z_trim|default(0)|float %}
    {% set t1_active = printer.dual_carriage["carriage_1"] == "PRIMARY" %}
    {% set applied = printer["gcode_macro _TOOLZ"].applied|float %}
    {% set baby = printer.gcode_move.homing_origin.z - applied %}
    {% set limit = 1.0 %}
    {% if params.GUARDAR_BABYSTEP|default(0)|int == 1 %}
        {% if not t1_active %}
            {action_raise_error("IDEX_Z_TRIM_T1: GUARDAR_BABYSTEP so' funciona com o T1 ativo (o babystep tem de ter sido dado com o T1).")}
        {% endif %}
        {% set new = old + baby %}
        {% set new_baby = 0.0 %}
    {% elif params.VALUE is defined %}
        {% set new = params.VALUE|float %}
        {% set new_baby = baby %}
    {% elif params.ADJUST is defined %}
        {% set new = old + params.ADJUST|float %}
        {% set new_baby = baby %}
    {% else %}
        {% set new = none %}
    {% endif %}
    {% if new is none %}
        RESPOND PREFIX="info" MSG="Ajuste fino do T1: Z {'%+.3f' % old} mm (soma-se ao offset Z calibrado, {'%.4f' % svv.tool_1_z_offset|default(0)|float} mm)."
    {% else %}
        {% if new|abs > limit %}
            {action_raise_error("IDEX_Z_TRIM_T1: %.3f mm e' demasiado (limite %.1f mm). Se o desvio e' assim tao grande, repete a calibracao do Z." % (new, limit))}
        {% endif %}
        SAVE_VARIABLE VARIABLE=tool_1_z_trim VALUE={'%.4f' % new}
        {% if t1_active %}
            # Aplica ja: offset do T1 = medido + ajuste novo + babystep
            {% set t1_z = svv.tool_1_z_offset|default(0)|float %}
            _SET_GCODE_OFFSET_BASE Z={t1_z + new + new_baby} MOVE={1 if "z" in printer.toolhead.homed_axes else 0}
            SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE={t1_z + new}
        {% endif %}
        RESPOND PREFIX="info" MSG="Ajuste fino do T1 gravado: Z {'%+.3f' % new} mm (antes {'%+.3f' % old} mm)."
    {% endif %}
