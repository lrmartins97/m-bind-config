# ============================================================================
# calibracao/xy_manual.cfg
# Calibracao do offset X/Y do T1 em relacao ao T0, assistida por camara
# (mira / crosshair). Alternativa manual ao kTAMV.
# ============================================================================
#
# O utilizador so precisa de um botao para avancar: CALIBRATE_IDEX_NEXT.
#
#   CALIBRATE_IDEX_XY MANUAL=1  -> so a posicao X/Y (exige a altura Z calibrada)
#   CALIBRATE_IDEX XY_MANUAL=1 -> completa: X/Y provisorio -> Z (switch,
#                                automatico) -> X/Y final
#   CALIBRATE_IDEX_NEXT       -> "o bico esta centrado, segue para o proximo"
#   CALIBRATE_IDEX_CANCEL     -> interrompe
#
# Em cada passo aparece uma janela (prompt) no KlipperScreen e no Mainsail com
# o que fazer, botoes de movimento fino e os botoes Seguinte / Cancelar
# (desativavel com use_prompt: 0). Fechar a janela (X) fecha-a em todos os
# ecras; CALIBRATE_IDEX_NEXT faz exatamente o mesmo que o botao Seguinte.
# Limites das interfaces (nao controlaveis pela macro): no Mainsail a janela
# fica sempre ao centro, com 400 px, e em telemovel ocupa o ecra todo; no
# KlipperScreen cabem no maximo 4 botoes por linha.
#
# A posicao da camara (X/Y/Z de foco) vem de _idex_vars, em troca_ferramenta.cfg.
# O offset X/Y e' gravado sempre por IDEX_SAVE_XY_OFFSET (idex_z_offset.py).
# ============================================================================
[gcode_macro _ALIGN_VARS]
variable_active: 0              ; 1 = calibracao manual em curso
variable_origin_x: 0.0
variable_origin_y: 0.0
variable_origin_set: 0          ; 0 = a espera do T0 | 1 = a espera do T1
variable_origin_known: 0        ; interno: 1 = o centro do T0 ja foi alinhado nesta calibracao (origin_x/y)
variable_mode: 0                ; 0 = so X/Y | 1 = completa, X/Y provisorio | 2 = completa, X/Y final (depois do Z pelo switch) | 3 = completa, X/Y final (depois do Z pelo papel)
variable_travel_accel: 1000     ; Aceleracao durante a deslocacao (mm/s^2); 0 = nao alterar
variable_home_if_needed: 1      ; 1 = home automatico se necessario, 0 = bloqueia e avisa
variable_jog_speed: 10          ; Velocidade dos botoes de movimento fino (mm/s)
variable_use_prompt: 1          ; 1 = janela com botoes (KlipperScreen e Mainsail) | 0 = sem janela: instrucoes na consola,
                                ;     move-se com os controlos normais e avanca-se com CALIBRATE_IDEX_NEXT
gcode:

# ---------------------------------------------------------------------------
# Comandos para o utilizador
# ---------------------------------------------------------------------------
[gcode_macro _IDEX_CAL_XY_MANUAL]
description: Posicao entre bicos - manual (mira). Exige a altura (Z) calibrada
gcode:
    IDEX_CHECK_XY_ALLOWED
    _CALIB_VISION_ON
    _ALIGN_START MODE=0

[gcode_macro _IDEX_CAL_ALL_MANUAL]
description: Calibracao completa guiada - X/Y manual, Z automatico, X/Y manual final
gcode:
    _CALIB_VISION_ON
    _ALIGN_START MODE=1

[gcode_macro CALIBRATE_IDEX_NEXT]
description: Calibracao manual - bico centrado na mira, seguir para o proximo passo
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% if av.active|int != 1 %}
        {action_raise_error("Nao ha nenhuma calibracao manual em curso. Comeca por CALIBRATE_IDEX_XY MANUAL=1 ou CALIBRATE_IDEX XY_MANUAL=1.")}
    {% endif %}
    RESPOND TYPE=command MSG="action:prompt_end"
    {% if av.origin_set|int == 0 %}
        _ALIGN_SET_ORIGIN
    {% else %}
        _ALIGN_SAVE_OFFSET
    {% endif %}

[gcode_macro CALIBRATE_IDEX_CANCEL]
description: Interrompe a calibracao manual em curso
gcode:
    {% set mode = printer["gcode_macro _ALIGN_VARS"].mode|int %}
    RESPOND TYPE=command MSG="action:prompt_end"
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=active VALUE=0
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_set VALUE=0
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=mode VALUE=0
    {% if "xyz" in printer.toolhead.homed_axes %}
        T0
        PARK_extruder
    {% endif %}
    _CALIB_VISION_OFF
    {% if mode == 0 %}
        RESPOND PREFIX="info" MSG="Calibracao interrompida. Nada foi gravado."
    {% else %}
        RESPOND PREFIX="info" MSG="Calibracao interrompida. A calibracao ficou incompleta: repete-a antes de imprimir com as duas cabecas."
    {% endif %}

# ---------------------------------------------------------------------------
# Uso interno
# ---------------------------------------------------------------------------
[gcode_macro _ALIGN_HOME_IF_NEEDED]
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% if "xyz" not in printer.toolhead.homed_axes %}
        {% if av.home_if_needed|int == 1 %}
            G28
        {% else %}
            {action_raise_error("Impressora nao homada. Executa G28 ou ativa 'home_if_needed'.")}
        {% endif %}
    {% endif %}

# Leva o bico ativo a camara, a altura de foco
[gcode_macro _ALIGN_GOTO_CAMERA]
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% set cam = printer["gcode_macro _idex_vars"] %}
    {% set prev_accel = printer.toolhead.max_accel %}
    {% if av.travel_accel|float > 0 %}
        SET_VELOCITY_LIMIT ACCEL={av.travel_accel}
    {% endif %}
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set org = printer.gcode_move.homing_origin %}
    # Foco: o medido (camera_focus_z, Z fisico) ou camera_z do troca_ferramenta.cfg,
    # convertido para a posicao G-code sem o babystep (igual a calibracao automatica)
    {% set focus_raw = printer.save_variables.variables.camera_focus_z|default(cam.camera_z)|float %}
    {% set baby = org.z - printer["gcode_macro _TOOLZ"].applied|float %}
    {% set focus_z = focus_raw - baby %}
    # Deslocacao com o prato afastado (nunca abaixo de safe_z nem da altura de
    # foco); so em cima da camara desce para o foco.
    {% set travel = [printer.toolhead.position.z, cv.safe_z, focus_z + org.z]|max - org.z %}
    # Para onde ir (posicao do T0 no centro; o T1, com os seus offsets
    # aplicados, vai para a mesma posicao G-code e fica perto do centro):
    #   1. o centro do T0 ja alinhado nesta calibracao (1a volta);
    #   2. senao, o ultimo centro medido (manual ou camara), gravado em
    #      camera_t0_x/y, se estiver a menos de 3 mm da posicao da camara;
    #   3. senao, a posicao da camara do troca_ferramenta.cfg.
    {% set svv = printer.save_variables.variables %}
    {% if av.origin_known|int == 1 %}
        {% set tx, ty = av.origin_x|float, av.origin_y|float %}
    {% elif svv.camera_t0_x is defined and svv.camera_t0_y is defined
          and (svv.camera_t0_x|float - cam.camera_x)|abs < 3 and (svv.camera_t0_y|float - cam.camera_y)|abs < 3 %}
        {% set tx, ty = svv.camera_t0_x|float, svv.camera_t0_y|float %}
    {% else %}
        {% set tx, ty = cam.camera_x, cam.camera_y %}
    {% endif %}
    G90
    G1 Z{travel} F{cam.camera_z_speed * 60}
    G1 X{tx} Y{ty} F{cam.camera_travel_speed * 60}
    G1 Z{focus_z} F{cam.camera_z_speed * 60}
    M400
    {% if av.travel_accel|float > 0 %}
        SET_VELOCITY_LIMIT ACCEL={prev_accel}
    {% endif %}

# Inicia (ou retoma no passo 3/3) a calibracao manual e leva o T0 a camara
[gcode_macro _ALIGN_START]
gcode:
    {% set mode = params.MODE|default(0)|int %}
    # A barreira do X/Y isolado (IDEX_CHECK_XY_ALLOWED) corre em
    # CALIBRATE_IDEX_XY MANUAL=1, antes de comecar.
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=mode VALUE={mode}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_set VALUE=0
    {% if mode != 2 %}
        SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_known VALUE=0
    {% endif %}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=active VALUE=1
    _ALIGN_HOME_IF_NEEDED
    # Cada ferramenta e' limpa imediatamente antes de ir a camara
    _IDEX_CAL_CLEAN_TOOL TOOL=0
    T0
    _ALIGN_GOTO_CAMERA
    _ALIGN_PROMPT

# Regista o T0 e leva o T1 a camara
[gcode_macro _ALIGN_SET_ORIGIN]
gcode:
    {% if "xy" not in printer.toolhead.homed_axes %}
        {action_raise_error("Impressora nao homada. Recomeca a calibracao.")}
    {% endif %}
    {% if printer.dual_carriage["carriage_0"] != "PRIMARY" %}
        {action_raise_error("O T0 nao esta ativo. Recomeca a calibracao.")}
    {% endif %}
    {% set pos = printer.toolhead.position %}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_x VALUE={pos.x}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_y VALUE={pos.y}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_set VALUE=1
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_known VALUE=1
    SAVE_VARIABLE VARIABLE=camera_t0_x VALUE={'%.3f' % pos.x}
    SAVE_VARIABLE VARIABLE=camera_t0_y VALUE={'%.3f' % pos.y}
    _ALIGN_PREP_T1

# Leva o T1 a camara, com o offset Z aplicado
[gcode_macro _ALIGN_PREP_T1]
gcode:
    _IDEX_CAL_CLEAN_TOOL TOOL=1
    T1
    # O T1 aplica os seus offsets guardados (X/Y e Z), o que o leva perto do
    # centro da camara e a mesma distancia dela que o T0. O calculo usa a
    # posicao fisica da cabeca, por isso o resultado e' o offset completo.
    # Os offsets nao sao alterados aqui: mexer no Z dessincronizava o _TOOLZ
    # e o T0 perdia o babystep no fim.
    _ALIGN_GOTO_CAMERA
    _ALIGN_PROMPT

# Grava o offset X/Y e segue para o passo seguinte (ou termina)
[gcode_macro _ALIGN_SAVE_OFFSET]
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% if av.origin_set|int != 1 %}
        {action_raise_error("A posicao do T0 ainda nao foi registada. Recomeca a calibracao.")}
    {% endif %}
    {% if printer.dual_carriage["carriage_1"] != "PRIMARY" %}
        {action_raise_error("O T1 nao esta ativo. Recomeca a calibracao.")}
    {% endif %}
    {% set mode = av.mode|int %}
    {% set pos = printer.toolhead.position %}
    {% set offset_x = pos.x - av.origin_x %}
    {% set offset_y = pos.y - av.origin_y %}

    # Grava pelo modulo (valida o offset Z para um X/Y final)
    IDEX_SAVE_XY_OFFSET X={offset_x} Y={offset_y} STATE={"PROVISIONAL" if mode == 1 else "FINAL"}
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=origin_set VALUE=0

    T0
    PARK_extruder

    {% if mode == 1 %}
        _ALIGN_GUIDED_Z
    {% else %}
        SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=mode VALUE=0
        SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=active VALUE=0
        _CALIB_VISION_OFF
        RESPOND PREFIX="info" MSG="Calibracao entre ferramentas concluida."
        IDEX_CALIBRATION_STATUS
    {% endif %}

# Passo 2/3 da calibracao completa: Z pelo switch, depois volta a camara
[gcode_macro _ALIGN_GUIDED_Z]
gcode:
    # Enquanto o Z corre nao ha nada para "Seguinte"; se o Z falhar, o fluxo
    # fica terminado e tem de ser recomecado.
    SET_GCODE_VARIABLE MACRO=_ALIGN_VARS VARIABLE=active VALUE=0
    RESPOND PREFIX="info" MSG="Passo 2/3: a medir a altura entre bicos no switch. Aguarda."
    CALIBRATE_IDEX_Z_OFFSET REQUIRE_SAVE=1 CLEAN=1
    _ALIGN_START MODE=2

# Movimento fino a partir da janela (a janela continua aberta)
[gcode_macro _ALIGN_JOG]
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% if av.active|int == 1 %}
        SAVE_GCODE_STATE NAME=_align_jog
        G91
        G1 X{params.X|default(0)|float} Y{params.Y|default(0)|float} F{av.jog_speed|float * 60}
        RESTORE_GCODE_STATE NAME=_align_jog
    {% endif %}

# Janela do passo atual (KlipperScreen e Mainsail)
# Botoes em linhas de 3: uma linha por eixo e sentido, do passo mais fino para
# o mais grosso a partir do centro (-0.01 -0.05 -0.10 | +0.10 +0.05 +0.01).
# A largura de cada botao depende do texto (nao se controla pela macro): por
# isso todos os textos tem o mesmo numero de caracteres (0.10 em vez de 0.1) e
# o menos e' o sinal matematico U+2212, com a mesma largura do mais.
[gcode_macro _ALIGN_PROMPT]
gcode:
    {% set av = printer["gcode_macro _ALIGN_VARS"] %}
    {% set mode = av.mode|int %}
    {% set tool = "T1" if av.origin_set|int == 1 else "T0" %}
    {% if mode == 0 %}
        {% set title = "Calibracao X/Y manual" %}
        {% set step = "" %}
    {% elif mode == 1 %}
        {% set title = "Calibracao completa (manual)" %}
        {% set step = "Passo 1/3 - " %}
    {% elif mode == 2 %}
        {% set title = "Calibracao completa (manual)" %}
        {% set step = "Passo 3/3 - " %}
    {% else %}
        {% set title = "Calibracao completa (manual)" %}
        {% set step = "Passo 2/2 - " %}
    {% endif %}
    {% if av.use_prompt|int == 1 %}
        RESPOND TYPE=command MSG="action:prompt_begin {title}"
        RESPOND TYPE=command MSG="action:prompt_text {step}Bico {tool}: move a cabeca ate o furo do bico ficar no centro da mira. Depois carrega em Seguinte."
        {% for axis, style in (("X", "info"), ("Y", "secondary")) %}
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for d in ("0.01", "0.05", "0.10") %}
                RESPOND TYPE=command MSG="action:prompt_button {axis} −{d}|_ALIGN_JOG {axis}=-{d}|{style}"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
            RESPOND TYPE=command MSG="action:prompt_button_group_start"
            {% for d in ("0.01", "0.05", "0.10") %}
                RESPOND TYPE=command MSG="action:prompt_button {axis} +{d}|_ALIGN_JOG {axis}={d}|{style}"
            {% endfor %}
            RESPOND TYPE=command MSG="action:prompt_button_group_end"
        {% endfor %}
        RESPOND TYPE=command MSG="action:prompt_footer_button Cancelar|CALIBRATE_IDEX_CANCEL|error"
        RESPOND TYPE=command MSG="action:prompt_footer_button Seguinte|CALIBRATE_IDEX_NEXT|primary"
        RESPOND TYPE=command MSG="action:prompt_show"
    {% endif %}
    RESPOND PREFIX="info" MSG="{step}Bico {tool}: centra o furo do bico na mira e carrega em Seguinte (ou CALIBRATE_IDEX_NEXT)."
