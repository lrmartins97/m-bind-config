# ============================================================================
# calibracao/altura_e_prato.cfg
# Altura do T0 em relacao ao prato (referencia da maquina) e nivelamento:
#   CALIBRAR_Z              teste do papel; grava-se com ACCEPT + SAVE_CONFIG
#   AJUSTAR_CAMA            ajuste dos parafusos do prato
#   Z_OFFSET_APPLY_ENDSTOP  torna permanente o babystep
# A altura fica no fim do printer.cfg (bloco SAVE_CONFIG).
# ============================================================================

[gcode_macro Z_ENDSTOP_CALIBRATE]
rename_existing: Z_ENDSTOP_CALIBRATE_ORIGINAL
description: Move to bed center and run Z endstop calibration

# --- Podes alterar estes valores diretamente aqui em baixo ---
variable_bed_x: 50
variable_bed_y: 70
variable_bed_z: 10          # Posição / altura de Z (mm)
variable_z_lift_speed: 10   # Velocidade de Z (mm/s)
variable_travel_speed: 100  # Velocidade de deslocação X/Y (mm/s)
# -------------------------------------------------------------

gcode:
    G28
    G90
    G1 Z{printer["gcode_macro Z_ENDSTOP_CALIBRATE"].bed_z} F{printer["gcode_macro Z_ENDSTOP_CALIBRATE"].z_lift_speed * 60}
    G1 X{printer["gcode_macro Z_ENDSTOP_CALIBRATE"].bed_x} Y{printer["gcode_macro Z_ENDSTOP_CALIBRATE"].bed_y} F{printer["gcode_macro Z_ENDSTOP_CALIBRATE"].travel_speed * 60}

    Z_ENDSTOP_CALIBRATE_ORIGINAL
    # Quando o teste do papel terminar (ACCEPT ou ABORT), o T0 vai para o parque
    _PARK_AFTER_MANUAL_START

[gcode_macro MEASURE_PLATE_HEIGHT]
description: Mede a altura do fundo de uma placa (ex. caixa de Petri) com o teste do papel, para o Z offset do slicer
# --- Valores por defeito (podem ser dados no comando: X= Y= START_Z=) ---
variable_x: 50                  ; Ponto de medicao X (centro da placa)
variable_y: 70                  ; Ponto de medicao Y
variable_start_z: 5             ; Altura a que o bico para antes do teste do papel (acima do fundo da placa)
variable_z_speed: 10            ; mm/s
variable_travel_speed: 100      ; mm/s
gcode:
    {% set mv = printer["gcode_macro MEASURE_PLATE_HEIGHT"] %}
    HOME_IF_NEEDED
    # Mede sempre com o T0, a referencia (o T1 segue pela sua diferenca de altura)
    T0
    _MEASURE_PLATE_GOTO X={params.X|default(mv.x)|float} Y={params.Y|default(mv.y)|float} START_Z={params.START_Z|default(mv.start_z)|float}
    RESPOND PREFIX="info" MSG="Medicao da placa: baixa o bico com TESTZ ate o papel arrastar no fundo da placa e carrega ACCEPT. O valor Z position indicado e a altura da placa: poe-o no Z offset do OrcaSlicer."
    MANUAL_PROBE

# Separada para ser avaliada depois do home e do T0 (posicao e offsets atuais)
[gcode_macro _MEASURE_PLATE_GOTO]
gcode:
    {% set mv = printer["gcode_macro MEASURE_PLATE_HEIGHT"] %}
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set org = printer.gcode_move.homing_origin.z %}
    {% set start_z = params.START_Z|float %}
    # Deslocacao com o prato afastado (livra as paredes da placa); so em cima
    # do ponto de medicao desce ate START_Z. Valores em Z fisico.
    {% set travel = [printer.toolhead.position.z, cv.safe_z, start_z]|max %}
    G90
    G1 Z{travel - org} F{mv.z_speed * 60}
    G1 X{params.X|float} Y{params.Y|float} F{mv.travel_speed * 60}
    G1 Z{start_z - org} F{mv.z_speed * 60}
    M400

[gcode_macro CALIBRAR_Z]
description: Calibração do endstop Z (distância bico ↔ mesa)
gcode:
    Z_ENDSTOP_CALIBRATE

[bed_screws]
screw1: 0, 0
screw1_name: Parafuso traseiro esquerdo (S1)

screw2: 100, 0
screw2_name: Parafuso traseiro direito (S2)

screw3: 50, 90
screw3_name: Parafuso frontal central (S3)

# ─────────────────────────────────────────────
# Macro de conveniência para iniciar o ajuste
# ─────────────────────────────────────────────
[gcode_macro AJUSTAR_CAMA]
description: Inicia o ajuste manual dos 3 parafusos da cama
gcode:
    {% if printer.toolhead.homed_axes != "xyz" %}
        G28          ; Faz home em todos os eixos se necessário
    {% endif %}
    BED_SCREWS_ADJUST
    # Quando o ajuste dos parafusos terminar, o T0 vai para o parque
    _PARK_AFTER_MANUAL_START

# ----------------------------------------------------------------------------
# Estacionar o T0 no fim de um ajuste manual
# ----------------------------------------------------------------------------
# O teste do papel (CALIBRAR_Z) e o ajuste dos parafusos (AJUSTAR_CAMA) ficam a
# espera do utilizador (ACCEPT / ADJUSTED / ABORT) depois de a macro acabar.
# Este verificador corre de segundo a segundo: quando o ajuste ja nao esta
# ativo, afasta o prato e leva o T0 para o parque (PARK_extruder).
# ----------------------------------------------------------------------------
[gcode_macro _PARK_AFTER_MANUAL_START]
gcode:
    UPDATE_DELAYED_GCODE ID=_PARK_AFTER_MANUAL DURATION=1

[delayed_gcode _PARK_AFTER_MANUAL]
gcode:
    {% set mp = printer.manual_probe.is_active|default(false) if printer.manual_probe is defined else false %}
    {% set bs = printer.bed_screws.is_active|default(false) if printer.bed_screws is defined else false %}
    {% if mp or bs %}
        UPDATE_DELAYED_GCODE ID=_PARK_AFTER_MANUAL DURATION=1
    {% elif "xyz" in printer.toolhead.homed_axes %}
        RESPOND PREFIX="info" MSG="Ajuste terminado: o T0 vai para o parque."
        PARK_extruder
    {% endif %}

# ----------------------------------------------------------------------------
# Guardar o babystep (tornar permanente o ajuste ao vivo)
# ----------------------------------------------------------------------------
#
# O comando nativo Z_OFFSET_APPLY_ENDSTOP funde o offset Z ATUAL no
# position_endstop. Isso so esta correto com a referencia do T0: com o T1
# ativo, o offset Z contem tambem o tool_1_z_offset, e consolida-lo
# corromperia a base absoluta da maquina.
#
# Este wrapper NAO troca de ferramenta fisicamente (nao parqueia, nao purga,
# nao move nada). Faz apenas a matematica: remove temporariamente o
# tool_1_z_offset do gcode offset, deixando so o BABYSTEP puro, consolida-o,
# e repoe o estado de offset como estava. E' seguro correr no fim de uma
# impressao independentemente da ferramenta que ficou ativa.
# ----------------------------------------------------------------------------
[gcode_macro Z_OFFSET_APPLY_ENDSTOP]
rename_existing: BASE_Z_OFFSET_APPLY_ENDSTOP
description: Consolida so o babystep na base do T0, sem mover a cabeca, seja qual for a ferramenta ativa
gcode:
    {% set tz = printer["gcode_macro _TOOLZ"] %}
    {% set applied = tz.applied %}

    {% if applied != 0.0 %}
        # Remove APENAS o offset de ferramenta do gcode offset (sem trocar de
        # carriage, sem parquear). Fica so o babystep puro no offset Z.
        SET_GCODE_OFFSET Z_ADJUST=-{applied}
        SET_GCODE_VARIABLE MACRO=_TOOLZ VARIABLE=applied VALUE=0
    {% endif %}

    # Agora o offset Z ativo = babystep puro (relativo a base do T0). Consolida.
    BASE_Z_OFFSET_APPLY_ENDSTOP

    {% if applied != 0.0 %}
        {action_respond_info("Babystep consolidado na base do T0 (offset de ferramenta T1 preservado em variables.cfg).")}
    {% else %}
        {action_respond_info("Babystep consolidado na base do T0.")}
    {% endif %}
