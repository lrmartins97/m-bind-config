# ============================================================================
# calibracao/camara.cfg
# Camara de calibracao (por baixo dos bicos): ligacao ao kTAMV, condicoes de
# imagem durante as medicoes e altura de foco.
# A posicao X/Y/Z da camara esta em _idex_vars (impressao/troca_ferramenta.cfg).
# ============================================================================

# Ligacao ao servidor kTAMV e a camara
[ktamv]
nozzle_cam_url: http://localhost/webcam2/snapshot?max_delay=0
server_url: http://localhost:8085
move_speed: 1800
send_frame_to_cloud: false
detection_tolerance: 1

# Camaras das ferramentas: os LEDs delas criam reflexos nas pontas de inox,
# por isso sao desligadas durante as medicoes X/Y (modulo tool_cameras.py).
[tool_cameras]
ports: 8082, 8083

# Condicoes de imagem para as medicoes com a camara do bico: anel de LEDs
# ligado (intensidade em _idex_vars, troca_ferramenta.cfg). As camaras das
# ferramentas ficam ligadas ou desligadas conforme calib_tool_cams_off (no
# mesmo sitio): a luz delas revela a borda da agulha mesmo sem pasta na ponta,
# e como bate do mesmo lado nas duas ferramentas, o desvio que causa anula-se
# no offset.
# A exposicao da camara do bico (600) esta no crowsnest.conf.
[gcode_macro _CALIB_VISION_ON]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    {% if cam.calib_tool_cams_off|default(1)|int == 1 %}
        TOOL_CAMERAS_OFF
    {% endif %}
    SET_LED LED=Led_Nozzle_Cam RED={cam.camera_led} GREEN={cam.camera_led} BLUE={cam.camera_led}

[gcode_macro _CALIB_VISION_OFF]
gcode:
    SET_LED LED=Led_Nozzle_Cam RED=0 GREEN=0 BLUE=0
    TOOL_CAMERAS_ON

# Altura de foco da camara do bico, medida com CALIBRATE_IDEX_CAMERA_FOCUS
# (modulo idex_camera_focus.py) e gravada em camera_focus_z (variables.cfg).
# As calibracoes X/Y usam esse valor; sem valor gravado usam camera_z
# (_idex_vars, troca_ferramenta.cfg).
[idex_camera_focus]
z_min: 2.0          ; Z fisico minimo durante a medicao: o prato nunca vai mais perto (confirmar a mao que e' seguro)
#range: 1.0         ; mm para cada lado do foco atual
#step: 0.05         ; mm entre alturas
#min_margin: 0.15   ; mm minimos da zona nitida para aceitar o resultado

# Z_MIN / Z_MAX: intervalo de Z a percorrer (Z fisico). Sem eles: 1 mm para
# cada lado do foco atual. Z_MIN nunca pode ser menor do que o z_min de
# seguranca de [idex_camera_focus]. GRAVAR=0: so' mostra o resultado.
[gcode_macro CALIBRATE_IDEX_CAMERA_FOCUS]
description: Mede a altura de foco da camara do bico (com o T0) e grava-a. Z_MIN/Z_MAX = intervalo (opcional). GRAVAR=0 so' mostra. LIMPEZA=0 nao limpa o bico
gcode:
    {% set zmin = params.Z_MIN|default("") %}
    {% set zmax = params.Z_MAX|default("") %}
    {% if (zmin == "") != (zmax == "") %}
        {action_raise_error("Indica os dois limites (Z_MIN e Z_MAX), ou nenhum.")}
    {% endif %}
    HOME_IF_NEEDED
    _IDEX_CAL_BEGIN LIMPEZA={params.LIMPEZA|default(1)|int}
    _IDEX_CAL_CLEAN_TOOL TOOL=0
    _CALIB_VISION_ON
    T0
    KTAMV_SEND_SERVER_CFG
    _IDEX_FOCUS_GOTO
    IDEX_CAMERA_FOCUS_SCAN SAVE={params.GRAVAR|default(1)|int}{(" ZMIN=%s ZMAX=%s" % (zmin|float, zmax|float)) if zmin != "" else ""}
    _CALIB_VISION_OFF

# Leva o T0 a camara, a altura de foco atual (avaliada depois do T0 estar ativo)
[gcode_macro _IDEX_FOCUS_GOTO]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    {% set focus_raw = printer.save_variables.variables.camera_focus_z|default(cam.camera_z)|float %}
    {% set baby = printer.gcode_move.homing_origin.z - printer["gcode_macro _TOOLZ"].applied|float %}
    _IDEX_XY_AUTO_GOTO FOCUS_Z={focus_raw - baby} X={cam.camera_x} Y={cam.camera_y}
