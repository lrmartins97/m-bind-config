#####################################################################
# calibracao/xy_camara.cfg
# Calibracao X/Y automatica do T1 com o kTAMV
#
# Regras (estado gerido pelo idex_z_offset.py):
#   - CALIBRATE_IDEX_XY (isolada) so corre
#     com offset Z valido entre ferramentas (IDEX_CHECK_XY_ALLOWED);
#   - o offset X/Y e' gravado SEMPRE por IDEX_SAVE_XY_OFFSET;
#   - CALIBRATE_IDEX faz tudo pela ordem certa: X/Y provisorio -> Z -> X/Y final.
#
# A posicao da camara (X/Y/Z de foco) vem de _idex_vars, em troca_ferramenta.cfg.
# Z= permite forcar outra altura de foco numa chamada (diagnostico).
#####################################################################

[gcode_macro _IDEX_CAL_XY_AUTO]
description: Posicao entre bicos - automatico (camara). Exige a altura (Z) calibrada. RECALIBRAR_CAMARA=1 volta a calibrar a camara (mm/pixel)
gcode:
    IDEX_CHECK_XY_ALLOWED
    _CALIB_VISION_ON
    # RECALIBRAR_CAMARA=1: volta a medir a relacao mm/pixel da camara antes de
    # medir os bicos (depois de mexer na camara, ou se o servidor kTAMV reiniciou).
    # A altura de foco e' a medida por CALIBRATE_IDEX_CAMERA_FOCUS (ou camera_z do troca_ferramenta.cfg).
    _IDEX_XY_AUTO STATE=FINAL FORCE_RECAL={params.RECALIBRAR_CAMARA|default(0)|int}
    _CALIB_VISION_OFF

# Sequencia comum a todos os modos. Cada passo e' uma macro separada para ser
# avaliada so' depois de o passo anterior ter terminado.
# A origem do T0 e' medida SEMPRE (nao se reaproveita de uma chamada anterior):
# se o printcore do T0 tiver sido trocado, uma origem antiga daria um offset
# errado. A calibracao da camara (mm/pixel) so' se repete se for preciso ou pedido.
[gcode_macro _IDEX_XY_AUTO]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    # Foco: o medido (camera_focus_z, Z fisico) ou, sem medicao, camera_z do
    # troca_ferramenta.cfg. Convertido para a posicao G-code sem o babystep: o T0 fica no
    # foco e o T1 (com o seu offset Z) a mesma distancia da camara.
    {% set focus_raw = printer.save_variables.variables.camera_focus_z|default(cam.camera_z)|float %}
    {% set baby = printer.gcode_move.homing_origin.z - printer["gcode_macro _TOOLZ"].applied|float %}
    {% set focus_z = focus_raw - baby %}
    HOME_IF_NEEDED
    KTAMV_SEND_SERVER_CFG
    # O servidor ainda tem a calibracao da camara? (se nao, e' feita a seguir)
    IDEX_KTAMV_MATRIX_CHECK
    # Cada ferramenta e' limpa imediatamente antes de ir a camara
    _IDEX_CAL_CLEAN_TOOL TOOL=0
    T0
    _IDEX_XY_AUTO_CAMERA FOCUS_Z={focus_z} FOCUS_RAW={focus_raw} FORCE_RECAL={params.FORCE_RECAL|default(0)}
    _IDEX_XY_AUTO_ORIGIN_T0 FOCUS_Z={focus_z}
    _IDEX_CAL_CLEAN_TOOL TOOL=1
    _IDEX_XY_AUTO_ALIGN_T1 FOCUS_Z={focus_z} STATE={params.STATE|default("FINAL")}

# Leva o bico ativo a camara, a altura de foco, e espera que assente.
[gcode_macro _IDEX_XY_AUTO_GOTO]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    {% set cv = printer["gcode_macro _CLEAN_VARS"] %}
    {% set org = printer.gcode_move.homing_origin %}
    {% set focus = params.FOCUS_Z|float %}
    # Deslocacao com o prato afastado (nunca abaixo de safe_z, para livrar o que
    # estiver no prato, nem abaixo da altura de foco); so em cima da camara
    # desce para o foco. Com o T1 ativo, o offset Z do T1 e' aplicado: o bico
    # fica a mesma distancia da camara que o T0.
    {% set travel = [printer.toolhead.position.z, cv.safe_z, focus + org.z]|max - org.z %}
    G90
    G0 Z{travel} F{cam.camera_z_speed * 60}
    G0 X{params.X|float} Y{params.Y|float} F{printer.ktamv.travel_speed}
    G0 Z{focus} F{cam.camera_z_speed * 60}
    M400
    G4 P300

# Calibracao da camara (mm/pixel), so' quando e' preciso ou pedida:
#   - pedida (RECALIBRAR_CAMARA=1)
#   - o Klipper nao tem o valor mm/pixel (e nao ha nenhum gravado para repor)
#   - o servidor kTAMV nao tem a tabela (ficheiro apagado ou estragado)
#   - o foco mudou desde a ultima calibracao da camara (a ampliacao muda)
[gcode_macro _IDEX_XY_AUTO_CAMERA]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    {% set svv = printer.save_variables.variables %}
    {% set focus_raw = params.FOCUS_RAW|float %}
    {% set forced = params.FORCE_RECAL|default(0)|int == 1 %}
    {% set no_mpp = printer.ktamv.mm_per_pixels|default("none")|lower == "none" %}
    {% set no_matrix = not printer.idex_camera_focus.matrix_ok %}
    {% set focus_changed = svv.camera_matrix_focus_z is not defined
                           or (svv.camera_matrix_focus_z|float - focus_raw)|abs > 0.05 %}
    {% if forced or no_mpp or no_matrix or focus_changed %}
        {% if forced %}
            RESPOND PREFIX="info" MSG="A calibrar a camara (pedido)."
        {% elif no_mpp or no_matrix %}
            RESPOND PREFIX="info" MSG="A calibrar a camara (nao ha calibracao da camara disponivel)."
        {% elif svv.camera_matrix_focus_z is not defined %}
            RESPOND PREFIX="info" MSG="A calibrar a camara (ainda nao ha registo do foco com que foi calibrada)."
        {% else %}
            RESPOND PREFIX="info" MSG="A calibrar a camara (o foco mudou desde a ultima calibracao da camara)."
        {% endif %}
        _IDEX_XY_AUTO_GOTO FOCUS_Z={params.FOCUS_Z} X={cam.camera_x} Y={cam.camera_y}
        KTAMV_CALIB_CAMERA
        _IDEX_SAVE_CAMERA_CAL FOCUS_RAW={focus_raw}
    {% endif %}

# Guarda o valor mm/pixel e o foco com que a camara foi calibrada (avaliada
# depois da calibracao da camara ter terminado). O mm/pixel e' reposto no
# kTAMV quando o Klipper arranca (idex_camera_focus.py), para nao ser preciso
# recalibrar a camara a cada arranque.
[gcode_macro _IDEX_SAVE_CAMERA_CAL]
gcode:
    {% set mpp = printer.ktamv.mm_per_pixels %}
    {% if mpp is not none and mpp|string|lower != "none" %}
        SAVE_VARIABLE VARIABLE=camera_mpp VALUE={mpp|float}
        SAVE_VARIABLE VARIABLE=camera_matrix_focus_z VALUE={params.FOCUS_RAW|float}
    {% endif %}

# Origem do T0: centra o bico do T0 na camara e regista a posicao.
[gcode_macro _IDEX_XY_AUTO_ORIGIN_T0]
gcode:
    {% set cam = printer["gcode_macro _idex_vars"] %}
    T0
    # O detetor esquece a ponta anterior (vai medir o T0)
    KTAMV_SEND_SERVER_CFG
    _IDEX_XY_AUTO_GOTO FOCUS_Z={params.FOCUS_Z} X={cam.camera_x} Y={cam.camera_y}
    KTAMV_FIND_NOZZLE_CENTER
    _IDEX_XY_AUTO_SET_ORIGIN

[gcode_macro _IDEX_XY_AUTO_SET_ORIGIN]
gcode:
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|string|lower == "true" %}
        KTAMV_SET_ORIGIN
        # Centro do T0 na camara, para a calibracao manual partir daqui
        SAVE_VARIABLE VARIABLE=camera_t0_x VALUE={'%.3f' % printer.toolhead.position.x}
        SAVE_VARIABLE VARIABLE=camera_t0_y VALUE={'%.3f' % printer.toolhead.position.y}
    {% else %}
        {action_raise_error("A camara nao conseguiu centrar o bico do T0. Limpa o bico e repete, ou usa a calibracao manual (CALIBRATE_IDEX XY_MANUAL=1 ou CALIBRATE_IDEX_XY MANUAL=1).")}
    {% endif %}

# Leva o T1 a camara (com os offsets atuais aplicados) e mede.
[gcode_macro _IDEX_XY_AUTO_ALIGN_T1]
gcode:
    {% set cc = printer.ktamv.camera_center_coordinates %}
    T1
    # O detetor esquece a ponta do T0 (vai medir o T1)
    KTAMV_SEND_SERVER_CFG
    _IDEX_XY_AUTO_GOTO FOCUS_Z={params.FOCUS_Z} X={cc[0]} Y={cc[1]}
    KTAMV_FIND_NOZZLE_CENTER
    KTAMV_GET_OFFSET
    _IDEX_XY_AUTO_SAVE STATE={params.STATE|default("FINAL")}

[gcode_macro _IDEX_XY_AUTO_SAVE]
gcode:
    {% if printer.ktamv.last_nozzle_center_successful|default("false")|string|lower == "true" %}
        IDEX_SAVE_XY_OFFSET X={printer.ktamv.last_calculated_offset[0]} Y={printer.ktamv.last_calculated_offset[1]} STATE={params.STATE|default("FINAL")}
        T0
    {% else %}
        {action_raise_error("A camara nao conseguiu centrar o bico do T1. Nada foi gravado. Limpa o bico e repete, ou usa a calibracao manual (CALIBRATE_IDEX XY_MANUAL=1 ou CALIBRATE_IDEX_XY MANUAL=1).")}
    {% endif %}
